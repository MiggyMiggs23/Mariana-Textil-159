        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/diferencias:
    get:
      operationId: getAdminDiferencias
      tags: [admin-analytics]
      summary: Diferencias agrupadas por cajero y tienda, tendencias y alertas
      parameters:
        - $ref: "#/components/parameters/AnalyticsDesde"
        - $ref: "#/components/parameters/AnalyticsHasta"
        - $ref: "#/components/parameters/AnalyticsUbicacionId"
        - {
            in: query,
            name: umbralCorte,
            schema: { type: number, minimum: 0, default: 500 },
          }
        - {
            in: query,
            name: umbralTienda,
            schema: { type: number, minimum: 0, default: 500 },
          }
        - {
            in: query,
            name: agrupacion,
            schema: { type: string, enum: [semana, mes], default: semana },
          }
      responses:
        "200":
          description: Resumen de diferencias
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDiferencias" }
