      summary: Busca rollos paginados respetando el alcance de sitio (50 por página)
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 150 } }
        - { in: query, name: sitioId, schema: { type: number } }
        - {
            in: query,
            name: estado,
            schema: { $ref: "#/components/schemas/EstadoRollo" },
          }
        - { in: query, name: productoId, schema: { type: number } }
        - {
            in: query,
            name: fechaDesde,
            schema: { type: string, format: date },
          }
        - {
            in: query,
            name: fechaHasta,
            schema: { type: string, format: date },
          }
        - { in: query, name: folio, schema: { type: number } }
        - {
            in: query,
            name: pendientesRevision,
            schema: { type: boolean, default: false },
            description: "Solo rollos con tres o más reimpresiones cuyo último evento aún no cubre una revisión ADMIN",
          }
        - {
            in: query,
            name: page,
            schema: { type: number, minimum: 1, default: 1 },
          }
        - {
            in: query,
            name: pageSize,
            schema: { type: number, minimum: 1, maximum: 50, default: 50 },
          }
      responses:
        "200":
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, page, pageSize, total]
                properties:
                  items:
                    {
                      type: array,
                      maxItems: 50,
                      items: { $ref: "#/components/schemas/RolloEtiqueta" },
                    }
                  limit: { type: number, minimum: 1, maximum: 50 }
                  page: { type: number, minimum: 1 }
                  pageSize: { type: number, minimum: 1, maximum: 50 }
                  total: { type: number }
