    E5Asignacion:
      type: object
      additionalProperties: false
      required: [notaId, movimientoVentaId, importe]
      properties:
        notaId: { type: integer, minimum: 1 }
        movimientoVentaId: { type: integer, minimum: 1, description: Movimiento exacto aprobado; notaId por sí solo no distingue cargos del mismo ticket }
        importe: { $ref: "#/components/schemas/E5Money" }
    E5Nota:
      type: object
      required: [notaId, movimientoVentaId, folio, ubicacionId, fecha, saldoPendiente, facturada]
      properties:
        notaId: { type: integer }
        movimientoVentaId: { type: integer }
        folio: { type: string }
        ubicacionId: { type: integer }
        fecha: { type: string, format: date-time }
        saldoPendiente: { $ref: "#/components/schemas/E5Money" }
        facturada: { type: boolean }
    E5Capacidades:
      type: object
      required: [puedeRecibir, puedePreparar, puedeAutorizar, puedeRechazar, puedeDevolver, puedeVerAvisos, puedeImprimir, preparacionADisponible]
      properties:
        puedeRecibir: { type: boolean }
        puedePreparar: { type: boolean }
        puedeAutorizar: { type: boolean }
        puedeRechazar: { type: boolean }
        puedeDevolver: { type: boolean }
        puedeVerAvisos: { type: boolean }
        puedeImprimir: { type: boolean }
        preparacionADisponible: { type: boolean, description: False hasta integración explícita E11; CONTADOR legacy no concede preparación }
