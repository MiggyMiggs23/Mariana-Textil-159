openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API para el sistema interno de Mariana Textil.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Sesión y acceso
  - name: dashboard
    description: Datos del tablero inicial
  - name: locations
    description: Administración de ubicaciones
  - name: users
    description: Administración de usuarios
  - name: productos
    description: Catálogo de productos/telas
  - name: precios
    description: Administración de precios de lista exclusiva para ADMIN
  - name: proveedores
    description: Administración de proveedores
  - name: clientes
    description: Catálogo operativo de clientes
  - name: permisos
    description: Administración de permisos por rol y por usuario
  - name: inventario
    description: Inventario de rollos, kardex, ajustes y conciliación
  - name: pos
    description: Punto de venta y búsqueda para terminal
  - name: caja
    description: Apertura, cobro y corte de caja
  - name: salidas
    description: Salidas entre ubicaciones y retiros completos a mostrador
  - name: admin-analytics
    description: Analítica financiera y operativa exclusiva para ADMIN
  - name: notificaciones
    description: Notificaciones y alertas de crédito exclusivas para ADMIN
  - name: etiquetas
    description: Búsqueda y reimpresión controlada de etiquetas de rollos
  - name: contenedores
    description: Próximos contenedores y control anual de compras
  - name: auditoria
    description: Consulta de la bitácora inmutable exclusiva para ADMIN
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Inicia sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Cierra la sesión actual
      responses:
        "204":
          description: Sesión cerrada
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Obtiene la sesión actual
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Obtiene conteos e inventario inicial por ubicación
      parameters:
        - in: query
          name: ubicacionId
          required: false
          schema:
            type: number
          description: Filtro opcional disponible únicamente para ADMIN
      responses:
        "200":
          description: Resumen del tablero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: Lista ubicaciones reales para administración
      responses:
        "200":
          description: Lista de ubicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Crea una tienda o bodega
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Ubicación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Edita el nombre, iniciales o estado de una ubicación
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Ubicación actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Lista usuarios
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [users]
      summary: Crea un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Edita datos, estado, ubicación o contraseña de un usuario
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /productos:
    get:
      operationId: listProductos
      tags: [productos]
      summary: Lista productos del catálogo
      parameters:
        - in: query
          name: ubicacionId
          description: Limita existencias a una ubicación permitida por el alcance de consulta.
          schema: { type: number }
        - in: query
          name: existencia
          description: Filtra el catálogo según las existencias cacheadas en las ubicaciones permitidas.
          schema:
            type: string
            enum: [TODOS, CON_EXISTENCIA, AGOTADOS]
            default: TODOS
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProducto
      tags: [productos]
      summary: Crea un producto en el catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoInput"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /precios:
    get:
      operationId: listPrecios
      tags: [precios]
      summary: Lista precios y márgenes actuales de todo el catálogo (ADMIN)
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: unidad, schema: { $ref: "#/components/schemas/UnidadProducto" } }
        - { in: query, name: semaforo, schema: { $ref: "#/components/schemas/SemaforoPrecio" } }
        - in: query
          name: modoPrecio
          description: Modo cuyo semáforo se usa para filtrar; ROLLO por compatibilidad.
          schema:
            $ref: "#/components/schemas/ModoPrecio"
            default: ROLLO
      responses:
        "200":
          description: Catálogo de precios, incluidos productos inactivos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PrecioProducto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /precios/{id}:
    get:
      operationId: getPrecio
      tags: [precios]
      summary: Detalle, historial y puntos cronológicos de precio (ADMIN)
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      responses:
        "200":
          description: Detalle de precio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrecioProductoDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /precios/{id}/cambiar:
    post:
      operationId: changePrecio
      tags: [precios]
      summary: Cambia un precio por modo y registra su historial inmutable (ADMIN)
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CambiarPrecioInput" }
      responses:
        "200":
          description: Precio actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrecioCambioResultado" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /precios/{id}/venta-por-metro:
    patch:
      operationId: updatePrecioVentaPorMetro
      tags: [precios]
      summary: Habilita o bloquea la venta metreada de un producto (ADMIN)
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrecioVentaPorMetroUpdate" }
      responses:
        "200":
          description: Interruptor actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrecioProducto" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /productos/{id}:
    get:
      operationId: getProducto
      tags: [productos]
      summary: Obtiene el detalle de un producto
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      responses:
        "200":
          description: Detalle del producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProducto
      tags: [productos]
      summary: Actualiza un producto del catálogo
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoUpdate"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /productos/import/preview:
    post:
      operationId: previewImportProductos
      tags: [productos]
      summary: Vista previa de importación de catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportFileInput"
      responses:
        "200":
          description: Filas con estado NUEVO, DUPLICADO o ERROR
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportPreviewRow"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /productos/import/confirm:
    post:
      operationId: confirmImportProductos
      tags: [productos]
      summary: Confirma importación de filas del catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportConfirmInput"
      responses:
        "200":
          description: Resultado de la importación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /proveedores/resumen:
    get:
      operationId: getProveedoresResumen
      tags: [proveedores]
      summary: Resumen agregado de todos los proveedores con saldos
      responses:
        "200":
          description: Resumen general de proveedores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedoresResumen"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /proveedores/analitica-global:
    get:
      operationId: getAnaliticaGlobalProveedores
      tags: [proveedores]
      summary: Analítica global de compras, deuda y costos de proveedores
      responses:
        "200":
          description: Analítica global
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnaliticaGlobalProveedores"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /proveedores:
    get:
      operationId: listProveedores
      tags: [proveedores]
      summary: Lista proveedores con métricas de compras
      responses:
        "200":
          description: Objeto con resumen y lista de proveedores con métricas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedoresListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createProveedor
      tags: [proveedores]
      summary: Crea un proveedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProveedorInput"
      responses:
        "201":
          description: Proveedor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /proveedores/{id}:
    get:
      operationId: getProveedor
      tags: [proveedores]
      summary: Obtiene el detalle de un proveedor
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
      responses:
        "200":
          description: Detalle del proveedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProveedor
      tags: [proveedores]
      summary: Actualiza un proveedor
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProveedorUpdate"
      responses:
        "200":
          description: Proveedor actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/compras:
    get:
      operationId: listComprasProveedor
      tags: [proveedores]
      summary: Lista compras de un proveedor con estado Pagada/Parcial/Pendiente
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: query
          name: desde
          schema: { type: string, format: date }
          description: Fecha inicio (inclusive), formato YYYY-MM-DD
        - in: query
          name: hasta
          schema: { type: string, format: date }
          description: Fecha fin (inclusive), formato YYYY-MM-DD
        - in: query
          name: estado
          schema:
            type: string
            enum: [PAGADA, PARCIAL, PENDIENTE]
          description: Filtrar por estado de pago
        - in: query
          name: page
          schema: { type: number, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: number, minimum: 1, maximum: 200, default: 20 }
      responses:
        "200":
          description: Lista paginada de compras del proveedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedorComprasResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/estado-cuenta:
    get:
      operationId: estadoCuentaProveedor
      tags: [proveedores]
      summary: Estado de cuenta cronológico con saldo corrido del proveedor
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: query
          name: desde
          schema: { type: string, format: date }
          description: Fecha inicio (inclusive), formato YYYY-MM-DD
        - in: query
          name: hasta
          schema: { type: string, format: date }
          description: Fecha fin (inclusive), formato YYYY-MM-DD
      responses:
        "200":
          description: Estado de cuenta con saldo corrido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedorEstadoCuenta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/pagos:
    get:
      operationId: listProveedorPagos
      tags: [proveedores]
      summary: Lista pagos de un proveedor (proveedores_finanzas requerido)
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
      responses:
        "200":
          description: Pagos del proveedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedorPagosResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: registrarPagoProveedor
      tags: [proveedores]
      summary: Registra un pago a proveedor (proveedores_finanzas + crear requerido)
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagoProveedorInput"
      responses:
        "201":
          description: Pago registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoProveedorRow"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/pagos/preview:
    post:
      operationId: previewPagoProveedor
      tags: [proveedores]
      summary: Calcula el reparto FIFO de un pago sin persistirlo
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PagoProveedorInput" }
      responses:
        "200":
          description: Reparto propuesto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewPagoProveedor" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /proveedores/{id}/compras/{compraId}:
    get:
      operationId: getProveedorCompraDetalle
      tags: [proveedores]
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: path
          name: compraId
          required: true
          description: Identificador de la entrada que originó la compra
          schema: { type: number }
      responses:
        "200":
          description: Compra y pagos aplicados
          content: { application/json: { schema: { $ref: "#/components/schemas/ProveedorCompraDetalle" } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /proveedores/{id}/pagos/{pagoId}:
    get:
      operationId: getProveedorPagoDetalle
      tags: [proveedores]
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: path
          name: pagoId
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Pago y compras aplicadas
          content: { application/json: { schema: { $ref: "#/components/schemas/ProveedorPagoDetalle" } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /proveedores/{id}/pagos/{pagoId}/reversar:
    post:
      operationId: reversarPagoProveedor
      tags: [proveedores]
      summary: Revierte un pago mediante un movimiento inverso inmutable
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: path
          name: pagoId
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MotivoReversoInput" }
      responses:
        "201":
          description: Reverso registrado
          content: { application/json: { schema: { $ref: "#/components/schemas/PagoProveedorRow" } } }
