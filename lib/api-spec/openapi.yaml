              fuente: { type: string, enum: [ABONO, ABONO_SALDO_FAVOR] }
              importe: { type: string }
              importeAnterior: { type: ["string", "null"] }
              variacionPorcentaje: { type: ["string", "null"] }
        matriz:
          type: object
