        - in: query
          name: ubicacionId
          schema: { type: number }
        - in: query
          name: usuarioId
          schema: { type: number }
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
        - in: query
          name: buscar
          schema: { type: string }
