            description: "Costo unitario ponderado por METRO o por KILO, según la unidad del producto",
          }
        historialCostos:
          type: array
          items:
            type: object
            required: [entradaId, fecha, cantidad, costoUnitario]
            properties:
              entradaId: { type: number }
              fecha: { type: string, format: date-time }
              cantidad: { type: string }
              costoUnitario: { type: string }
        comparacionProveedores:
          type: array
          items:
            type: object
            required: [proveedorId, proveedor, costoUnitario]
            properties:
              proveedorId: { type: number }
              proveedor: { type: string }
              costoUnitario: { type: string }
        proveedorMasBarato: { type: ["string", "null"] }
        ahorroPotencial: { type: string }
    EstadisticasPorTela:
      type: object
      required: [tela, totalCosto, rollosCount]
      properties:
        tela: { type: string }
        totalCosto: { type: string }
        rollosCount: { type: number }
    EstadisticasPorColor:
      type: object
      required: [color, totalCosto, rollosCount]
      properties:
        color: { type: string }
        totalCosto: { type: string }
        rollosCount: { type: number }
    ProveedorEstadisticas:
      type: object
      required:
        [
          desde,
          hasta,
          totalCompras,
          comprasCount,
          totalRollos,
          costoPorMetro,
          costoPorKilo,
          ticketPromedio,
          frecuencia,
          estacionalidad,
          concentracion,
          productosExclusivos,
          diasPromedioPago,
          antiguedadDeuda,
          margenGenerado,
          porMes,
          porProducto,
          porTela,
          porColor,
        ]
      properties:
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }
        totalCompras: { type: string }
        comprasCount: { type: number }
        totalRollos:
          {
            type: number,
            description: "Total de rollos recibidos en el periodo",
          }
        costoPorMetro:
          {
            type: ["string", "null"],
            description: "Costo unitario ponderado por METRO",
          }
        costoPorKilo:
          {
            type: ["string", "null"],
            description: "Costo unitario ponderado por KILO",
          }
        ticketPromedio:
          { type: string, description: "Importe promedio por compra (entrada)" }
        diasDesdeUltimaCompra:
          {
            type: ["number", "null"],
            description: "Días desde la última compra hasta hoy; null si no hay compras",
          }
        ultimaCompra: { type: ["string", "null"], format: date-time }
        frecuencia:
          type: object
          required: [promedioDiasEntreCompras, ultimaCompra]
          properties:
            promedioDiasEntreCompras: { type: ["string", "null"] }
            ultimaCompra: { type: ["string", "null"], format: date-time }
        estacionalidad:
          type: object
          required: [mesMayor, mesMenor]
          properties:
            mesMayor:
              type: [object, "null"]
              properties: { mes: { type: string }, total: { type: string } }
            mesMenor:
              type: [object, "null"]
              properties: { mes: { type: string }, total: { type: string } }
        concentracion:
          type: object
          required: [productoPrincipalPct, tresPrincipalesPct]
          properties:
            productoPrincipalPct: { type: string }
            tresPrincipalesPct: { type: string }
        productosExclusivos:
          type: array
          items:
            type: object
            required: [productoId, sku, tela, color]
            properties:
              productoId: { type: number }
              sku: { type: string }
              tela: { type: string }
              color: { type: string }
        diasPromedioPago: { type: ["string", "null"] }
        antiguedadDeuda:
          type: object
          required: [hasta30, de31a60, de61a90, mas90]
          properties:
            hasta30: { type: string }
            de31a60: { type: string }
            de61a90: { type: string }
            mas90: { type: string }
        margenGenerado:
          type: object
          required:
            [
              ventas,
              costo,
              margen,
              margenPct,
              lineasIncluidas,
              lineasExcluidasSinRollo,
              lineasExcluidasSinCosto,
              nota,
            ]
          properties:
            ventas: { type: string }
            costo: { type: string }
            margen: { type: string }
            margenPct: { type: ["string", "null"] }
            lineasIncluidas: { type: number }
            lineasExcluidasSinRollo: { type: number }
            lineasExcluidasSinCosto: { type: number }
            nota: { type: string }
        porMes:
          type: array
          items:
            $ref: "#/components/schemas/EstadisticasPorMes"
        porProducto:
          type: array
          items:
            $ref: "#/components/schemas/EstadisticasPorProducto"
        porTela:
          type: array
          items:
            $ref: "#/components/schemas/EstadisticasPorTela"
        porColor:
          type: array
          items:
            $ref: "#/components/schemas/EstadisticasPorColor"
    AnaliticaGlobalProveedores:
      type: object
      required:
        [
          pareto,
          deuda,
          tendenciaMensual,
          costosAlAlza,
          comparacionCostos,
          antiguedadDeuda,
        ]
      properties:
        pareto:
          type: array
          items:
            type: object
            required: [proveedorId, proveedor, total, porcentajeAcumulado]
            properties:
              proveedorId: { type: number }
              proveedor: { type: string }
              total: { type: string }
              porcentajeAcumulado: { type: string }
        deuda:
          type: array
          items:
            type: object
            required: [proveedorId, proveedor, saldo]
            properties:
              proveedorId: { type: number }
              proveedor: { type: string }
              saldo: { type: string }
        tendenciaMensual:
          type: array
          items:
            type: object
            required: [mes, total]
            properties:
              mes: { type: string }
              total: { type: string }
        costosAlAlza:
          type: array
          items:
            type: object
            required:
              [
                productoId,
                sku,
                proveedor,
                costoAnterior,
                costoActual,
                variacionPct,
              ]
            properties:
              productoId: { type: number }
              sku: { type: string }
              proveedor: { type: string }
              costoAnterior: { type: string }
              costoActual: { type: string }
              variacionPct: { type: string }
        comparacionCostos:
          type: array
          items:
            type: object
            required:
              [
                productoId,
                sku,
                unidad,
                proveedorMasBarato,
                costoMasBarato,
                costoMasCaro,
                ahorroPct,
                proveedores,
              ]
            properties:
              productoId: { type: number }
              sku: { type: string }
              unidad: { type: string }
              proveedorMasBarato: { type: string }
              costoMasBarato: { type: string }
              costoMasCaro: { type: string }
              ahorroPct: { type: string }
              proveedores:
                type: array
                items:
                  type: object
                  required: [proveedorId, proveedor, costoUnitario]
                  properties:
                    proveedorId: { type: number }
                    proveedor: { type: string }
                    costoUnitario: { type: string }
        antiguedadDeuda:
          type: object
          required: [hasta30, de31a60, de61a90, mas90]
          properties:
            hasta30: { type: string }
            de31a60: { type: string }
            de61a90: { type: string }
            mas90: { type: string }
    TipoTicket:
      type: string
      enum: [NORMAL, METREADO]
    EstadoTicket:
      type: string
      enum: [VENDIDO, CANCELADO]
    DocumentoTipoTicket:
      type: string
      description: Tipo documental persistido del comprobante de venta.
      enum: [TICKET, NOTA]
    FormaPagoTicket:
      type: string
      description: FACTURADO, EFECTIVO y TRANSFERENCIA son seleccionables; CREDITO se conserva solo para leer registros históricos.
      enum: [EFECTIVO, TRANSFERENCIA, FACTURADO, CREDITO]
    EstadoSesionCaja:
      type: string
      enum: [ABIERTA, CERRADA]
    CredencialesAdmin:
      type: object
      required: [usuario, password]
      properties:
        usuario: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 128 }
    PosRolloDisponible:
      type: object
      required:
        [
          id,
          serie,
          productoId,
          sku,
          tela,
          color,
          unidad,
          ubicacionId,
          nombreUbicacion,
          cantidadActual,
          precioSugerido,
        ]
      properties:
        id: { type: number }
        serie: { type: string }
        productoId: { type: number }
        sku: { type: string }
        tela: { type: string }
        color: { type: string }
        unidad:
          $ref: "#/components/schemas/UnidadProducto"
        ubicacionId: { type: number }
        nombreUbicacion: { type: string }
        cantidadActual: { type: string }
        precioSugerido: { type: ["string", "null"] }
    PosProducto:
      type: object
      required:
        [
          id,
          sku,
          tela,
          color,
          unidad,
          precioSugerido,
          precioMayoreo,
          precioMenudeo,
          costoReferenciaMetreado,
          seVendePorMetro,
          activo,
        ]
      properties:
        id: { type: number }
        sku: { type: string }
        tela: { type: string }
        color: { type: string }
        unidad:
          $ref: "#/components/schemas/UnidadProducto"
        precioSugerido: { type: ["string", "null"] }
        precioMayoreo: { type: ["string", "null"] }
        precioMenudeo: { type: ["string", "null"] }
        costoReferenciaMetreado:
          { $ref: "#/components/schemas/CostoReferenciaMetreado" }
        seVendePorMetro: { type: boolean }
        activo: { type: boolean }
    PosBusquedaResult:
      type: object
      required: [rollos, productos]
      properties:
        rollos:
          type: array
          description: Solo rollos con estado DISPONIBLE
          items:
            $ref: "#/components/schemas/PosRolloDisponible"
        productos:
          type: array
          items:
            $ref: "#/components/schemas/PosProducto"
    PosPrecioValidationInput:
      type: object
      required: [rolloId, productoId, ubicacionId, precioUnitario]
      properties:
        rolloId: { type: number }
        productoId: { type: number }
        ubicacionId: { type: number }
        precioUnitario: { type: number, exclusiveMinimum: 0 }
    PosPrecioValidationResult:
      type: object
      required: [valido]
      properties:
        valido: { type: boolean }
        mensaje: { type: string }
        code: { type: string }
    TicketLineaInput:
      type: object
      required: [rolloId, productoId, tipo, cantidad, precioUnitario]
      properties:
        rolloId:
          type: ["number", "null"]
          description: Obligatorio para línea NORMAL de rollo completo; debe ser null en línea METREADO.
        productoId: { type: number }
        tipo:
          $ref: "#/components/schemas/TipoTicket"
        cantidad: { type: number, exclusiveMinimum: 0 }
        precioUnitario: { type: number, minimum: 0 }
    TicketInput:
      type: object
      required: [uuidCliente, ubicacionId, clienteId, facturado, lineas]
      properties:
        uuidCliente:
          {
            type: string,
            description: Identificador UUID generado por la terminal,
          }
        ubicacionId: { type: number }
        clienteId: { type: number, minimum: 1 }
        documentoTipo:
          $ref: "#/components/schemas/DocumentoTipoTicket"
          default: TICKET
        notaSinPrecios:
          type: boolean
          default: false
          description: Solo aplica a NOTA; la copia CLIENTE omite estructuralmente los importes.
        nombreDestinatario:
          type: ["string", "null"]
          description: Instantánea opcional del destinatario; obligatoria junto con dirección para NOTA de Venta a Público.
        direccionEntregaSnapshot:
          type: ["string", "null"]
          description: Instantánea opcional de la dirección de entrega; obligatoria junto con destinatario para NOTA de Venta a Público.
        tipo:
          $ref: "#/components/schemas/TipoTicket"
          description: Valor temporal heredado por líneas que no incluyan tipo; los clientes nuevos deben indicar tipo por línea.
        facturado: { type: boolean }
        diasPlazo:
          type: ["number", "null"]
          enum: [7, 15, 30, 60]
          description: Obligatorio para NOTA y vacío para TICKET; se elige y congela en POS.
        lineas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TicketLineaInput"
    ComportamientoPagoCliente:
      type: object
      required: [clienteId, clienteNombre, percentage, settledNotes, evaluatedNotes, onTimeNotes, overdueOpenNotes, openNotDueNotes, color, sufficientHistory, utilizationPercent, suggestCreditIncrease, period, explanation]
      properties:
        clienteId: { type: number }
        clienteNombre: { type: string }
        percentage: { type: number }
        settledNotes: { type: number }
        evaluatedNotes: { type: number }
        onTimeNotes: { type: number }
        overdueOpenNotes: { type: number }
        openNotDueNotes: { type: number }
        color: { type: string, enum: [GREEN, YELLOW, RED, INSUFFICIENT] }
        sufficientHistory: { type: boolean }
        utilizationPercent: { type: number }
        suggestCreditIncrease: { type: boolean }
        suggestionReason: { type: ["string", "null"] }
        period: { type: string }
        explanation: { type: string }
    TicketPagoInput:
      type: object
      required: [formaPago, importe]
      properties:
        formaPago:
          $ref: "#/components/schemas/FormaPagoTicket"
        importe: { type: number, exclusiveMinimum: 0 }
        referencia: { type: ["string", "null"] }
    TicketCobroInput:
      type: object
      required: [pagos]
      properties:
        pagos:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TicketPagoInput"
        clienteId: { type: ["number", "null"] }
        facturado:
          type: boolean
          description: Al cobrar, activa la factura y su IVA para el ticket completo en la misma transacción.
    TicketCancelacionInput:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 1, maxLength: 1000 }
        credencialesAdmin:
          oneOf:
            - $ref: "#/components/schemas/CredencialesAdmin"
            - type: "null"
    TicketPago:
      type: object
      required:
        [
          id,
          ticketId,
          formaPago,
          importe,
          referencia,
          createdAt,
          usuarioId,
          nombreUsuario,
        ]
      properties:
        id: { type: number }
        ticketId: { type: number }
        formaPago:
          $ref: "#/components/schemas/FormaPagoTicket"
        importe: { type: string }
        referencia: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        usuarioId: { type: number }
        nombreUsuario: { type: string }
    TicketLinea:
      type: object
      required:
        [
          id,
          ticketId,
          rolloId,
          productoId,
          tipo,
          cantidad,
          precioUnitario,
          precioSugerido,
          importe,
          skuProducto,
          telaProducto,
          colorProducto,
          unidadProducto,
          serieRollo,
          nombreUbicacion,
        ]
      properties:
        id: { type: number }
        ticketId: { type: number }
        rolloId: { type: ["number", "null"] }
        productoId: { type: number }
        tipo:
          $ref: "#/components/schemas/TipoTicket"
        cantidad: { type: string }
        precioUnitario: { type: string }
        precioSugerido: { type: string }
        importe: { type: string }
        skuProducto: { type: string }
        telaProducto: { type: string }
        colorProducto: { type: string }
        unidadProducto:
          $ref: "#/components/schemas/UnidadProducto"
        serieRollo: { type: ["string", "null"] }
        nombreUbicacion: { type: string }
        costoUnitarioCongelado:
          type: ["string", "null"]
          description: Dato administrativo; puede omitirse para TERMINAL
        costoTotalCongelado:
          type: ["string", "null"]
          description: Dato administrativo; puede omitirse para TERMINAL
        costoFuente:
          type: ["string", "null"]
          enum: [EXACT_ROLL, AVERAGE_12_MONTHS, STALE_LAST_KNOWN, NO_COST, null]
          description: Proveniencia congelada del costo; dato administrativo que se omite sin acceso económico
        margen:
          type: ["string", "null"]
          description: Dato administrativo calculado; puede omitirse para TERMINAL
    TicketResumen:
      type: object
      required:
        [
          id,
          folio,
          ubicacionId,
          nombreUbicacion,
          usuarioTerminalId,
          nombreUsuarioTerminal,
          clienteId,
          nombreCliente,
          notaSinPrecios,
          subtotal,
          iva,
          tasaIva,
          total,
          estado,
          facturado,
          uuidCliente,
          createdAt,
          canceladoAt,
          canceladoPor,
          nombreUsuarioCancelacion,
          motivoCancelacion,
          autorizadoPor,
          nombreUsuarioAutorizacion,
        ]
      properties:
        id: { type: number }
        folio: { type: number }
        ubicacionId: { type: number }
        nombreUbicacion: { type: string }
        usuarioTerminalId: { type: number }
        nombreUsuarioTerminal: { type: string }
        clienteId: { type: ["number", "null"] }
        nombreCliente: { type: ["string", "null"] }
        notaSinPrecios: { type: boolean }
        direccionEntregaEfectiva: { type: ["string", "null"] }
        subtotal: { type: string }
        iva:
          {
            type: string,
            description: IVA aplicado al ticket; es 0.00 si no fue facturado,
          }
        tasaIva:
          { type: string, description: Tasa de IVA vigente al crear el ticket }
        total: { type: string }
        estado:
          $ref: "#/components/schemas/EstadoTicket"
        lineasCount: { type: number }
        cobrado: { type: boolean }
        cobradoAt: { type: ["string", "null"], format: date-time }
        usuarioCajaId: { type: ["number", "null"] }
        nombreUsuarioCaja: { type: ["string", "null"] }
        facturado: { type: boolean }
        sesionCajaId: { type: ["number", "null"] }
        uuidCliente:
          {
            type: string,
            description: Identificador UUID generado por la terminal,
          }
        createdAt: { type: string, format: date-time }
        canceladoAt: { type: ["string", "null"], format: date-time }
        canceladoPor: { type: ["number", "null"] }
        nombreUsuarioCancelacion: { type: ["string", "null"] }
        motivoCancelacion: { type: ["string", "null"] }
        autorizadoPor: { type: ["number", "null"] }
        nombreUsuarioAutorizacion: { type: ["string", "null"] }
    TicketCredito:
      type: object
      description: Datos persistidos y saldo de ledger de la porción a crédito del ticket.
      required:
        [
          esCredito,
          importeCredito,
          diasPlazo,
          fechaVencimiento,
          saldoPendiente,
          telefonoCliente,
          correoCliente,
          direccionCliente,
        ]
      properties:
        esCredito: { type: boolean }
        importeCredito: { type: string }
        diasPlazo: { type: ["number", "null"], enum: [7, 15, 30, 60] }
        fechaVencimiento: { type: ["string", "null"], format: date }
        saldoPendiente:
          {
            type: string,
            description: Saldo FIFO actual de la porción a crédito de esta venta,
            después de abonos y reversos,
          }
        telefonoCliente: { type: ["string", "null"] }
        correoCliente: { type: ["string", "null"] }
        direccionCliente: { type: ["string", "null"] }
    TicketCajaResumen:
      type: object
      required:
        [
          id,
          folio,
          subtotal,
          iva,
          tasaIva,
          total,
          facturado,
          createdAt,
          cobrado,
          cobradoAt,
          formasPago,
          documentoTipo,
          autorizacionEstado,
        ]
      properties:
        id: { type: number }
        folio: { type: number }
        subtotal: { type: string }
        iva: { type: string }
        tasaIva: { type: string }
        total: { type: string }
        facturado: { type: boolean }
        createdAt: { type: string, format: date-time }
        cobrado: { type: boolean }
        cobradoAt: { type: ["string", "null"], format: date-time }
        documentoTipo: { $ref: "#/components/schemas/DocumentoTipoTicket" }
        autorizacionEstado: { type: string, enum: [NO_APLICA, PENDIENTE, AUTORIZADA] }
        autorizadoAt: { type: ["string", "null"], format: date-time }
        formasPago:
          type: array
          items:
            $ref: "#/components/schemas/FormaPagoTicket"
    AutorizacionNotaProyeccion:
      type: object
