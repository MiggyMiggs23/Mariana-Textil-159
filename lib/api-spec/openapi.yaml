        - $ref: "#/components/parameters/ReporteCoberturaExceso"
      responses:
        "200": { description: Archivo PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auditoria:
    get:
      operationId: listAuditoria
      tags: [auditoria]
      summary: Lista la auditoría newest-first (solo ADMIN)
      parameters:
        - { in: query, name: desde, schema: { $ref: "#/components/schemas/CalendarDate" } }
        - { in: query, name: hasta, schema: { $ref: "#/components/schemas/CalendarDate" } }
        - { in: query, name: usuarioId, schema: { type: number, minimum: 1 } }
        - { in: query, name: modulo, schema: { type: string, maxLength: 80 } }
        - { in: query, name: accion, schema: { type: string, maxLength: 80 } }
        - { in: query, name: sitioId, schema: { type: number, minimum: 1 } }
        - { in: query, name: search, schema: { type: string, maxLength: 150 } }
        - { in: query, name: page, schema: { type: number, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: number, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Resultado paginado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditoriaListResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auditoria/export.xlsx:
    get:
      operationId: exportAuditoriaXlsx
      tags: [auditoria]
      summary: Exporta el resultado filtrado completo con límite conservador (solo ADMIN)
      parameters:
        - { in: query, name: desde, schema: { $ref: "#/components/schemas/CalendarDate" } }
        - { in: query, name: hasta, schema: { $ref: "#/components/schemas/CalendarDate" } }
        - { in: query, name: usuarioId, schema: { type: number, minimum: 1 } }
        - { in: query, name: modulo, schema: { type: string, maxLength: 80 } }
        - { in: query, name: accion, schema: { type: string, maxLength: 80 } }
        - { in: query, name: sitioId, schema: { type: number, minimum: 1 } }
        - { in: query, name: search, schema: { type: string, maxLength: 150 } }
      responses:
        "200":
          description: Archivo XLSX (máximo 10000 filas)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auditoria/{id}:
    get:
      operationId: getAuditoria
      tags: [auditoria]
      summary: Obtiene detalle y evidencia antes/después (solo ADMIN)
      parameters:
        - { in: path, name: id, required: true, schema: { type: number, minimum: 1 } }
      responses:
        "200":
          description: Detalle de auditoría
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditoriaDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  parameters:
    ReportePeriodo:
      name: periodo
      in: query
      schema: { type: string, enum: [diario, semanal, mensual, trimestral, semestral, anual, personalizado], default: mensual }
    ReporteUbicacionIds: { name: ubicacionIds, in: query, schema: { type: string } }
    ReporteProductoIds: { name: productoIds, in: query, schema: { type: string } }
    ReporteTelas: { name: telas, in: query, schema: { type: string } }
    ReporteColores: { name: colores, in: query, schema: { type: string } }
    ReporteUnidades: { name: unidades, in: query, schema: { type: string } }
    ReporteUsuarioIds: { name: usuarioIds, in: query, schema: { type: string } }
    ReporteClienteIds: { name: clienteIds, in: query, schema: { type: string } }
    ReporteProveedorIds: { name: proveedorIds, in: query, schema: { type: string } }
    ReporteFormasPago: { name: formasPago, in: query, schema: { type: string } }
    ReporteFacturado: { name: facturado, in: query, schema: { type: boolean } }
    ReporteModalidad:
      name: modalidad
      in: query
      description: Modalidad de las líneas de venta; Todo no restringe resultados.
      schema: { type: string, enum: [TODO, ROLLOS, METRAJE], default: TODO }
    ReporteMargenUmbral: { name: margenUmbral, in: query, schema: { type: number, default: 15 } }
    ReporteCoberturaCritico: { name: coberturaCritico, in: query, schema: { type: number, default: 7 } }
    ReporteCoberturaBajo: { name: coberturaBajo, in: query, schema: { type: number, default: 15 } }
    ReporteCoberturaNormal: { name: coberturaNormal, in: query, schema: { type: number, default: 60 } }
    ReporteCoberturaExceso: { name: coberturaExceso, in: query, schema: { type: number, default: 90 } }
    AnalyticsDesde:
      name: desde
      in: query
      schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      description: Día inicial en America/Mexico_City
    AnalyticsHasta:
      name: hasta
      in: query
      schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      description: Día final en America/Mexico_City
    AnalyticsUbicacionId:
      name: ubicacionId
      in: query
      schema: { type: number }
    LocationId:
      name: id
      in: path
      required: true
      schema:
        type: number
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ProductoId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ProveedorId:
      name: id
      in: path
      required: true
      schema:
        type: number
    RolloId:
      name: id
      in: path
      required: true
      schema:
        type: number
    MovimientoId:
      name: id
      in: path
      required: true
      schema:
        type: number
    EntradaId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ContenedorId:
      name: id
      in: path
      required: true
      schema:
        type: number
    SalidaId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ClienteId:
      name: id
      in: path
      required: true
      schema:
        type: number
    TicketId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ClienteTicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: number
    ClientePagoId:
      name: pagoId
      in: path
      required: true
      schema:
        type: number
    SesionCajaId:
      name: id
      in: path
      required: true
      schema:
        type: number
    NotificacionId:
      name: id
      in: path
      required: true
      schema:
        type: number
  responses:
    SalidaDetailResponse:
      description: Estado actualizado de la salida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SalidaDetail"
    Unauthorized:
      description: Sesión no válida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sin permisos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Demasiados intentos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AuditoriaEntry:
      type: object
      required: [id, fecha, usuarioId, usuario, rolSnapshot, accion, modulo, entidad, entidadId, sitioId, sitio, ip]
      properties:
        id: { type: string }
        fecha: { type: string, format: date-time }
        usuarioId: { type: ["number", "null"] }
        usuario: { type: ["string", "null"] }
        rolSnapshot: { type: ["string", "null"] }
        accion: { type: string }
        modulo: { type: ["string", "null"] }
        entidad: { type: string }
        entidadId: { type: ["string", "null"] }
        sitioId: { type: ["number", "null"] }
        sitio: { type: ["string", "null"] }
        ip: { type: string }
    AuditoriaDetail:
      allOf:
        - { $ref: "#/components/schemas/AuditoriaEntry" }
        - type: object
          required: [datosAntes, datosDespues]
          properties:
            datosAntes: { type: ["object", "null"], additionalProperties: true }
            datosDespues: { type: ["object", "null"], additionalProperties: true }
    AuditoriaListResult:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditoriaEntry" }
        total: { type: number }
        page: { type: number }
        pageSize: { type: number }
    CalendarDate:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      description: Calendar day in YYYY-MM-DD; never coerced to an instant.
    EstadoContenedor:
      type: string
      enum: [EN_TRANSITO, RECIBIDO, CANCELADO]
    ContenedorCatalogoProducto:
      type: object
      required: [id, sku, tela, color, unidad]
      properties:
        id: { type: number }
        sku: { type: string }
        tela: { type: string }
        color: { type: string }
        unidad: { type: string, enum: [METRO, KILO] }
    ContenedorCatalogoSimple:
      type: object
      required: [id, nombre]
      properties:
        id: { type: number }
        nombre: { type: string }
    ContenedorCatalogos:
      type: object
      required: [productos, proveedores, sitios]
      properties:
        productos:
          type: array
          items: { $ref: "#/components/schemas/ContenedorCatalogoProducto" }
        proveedores:
          type: array
          items: { $ref: "#/components/schemas/ContenedorCatalogoSimple" }
        sitios:
          type: array
          items: { $ref: "#/components/schemas/ContenedorCatalogoSimple" }
    ContenedorLineaInput:
      type: object
      required: [productoId, cantidadEsperada]
      properties:
        productoId: { type: number }
        cantidadEsperada: { type: string, pattern: "^\\d+(\\.\\d{1,3})?$" }
        rollosEsperados: { type: ["number", "null"], minimum: 1 }
        nota: { type: ["string", "null"] }
    ContenedorInput:
      type: object
      required: [proveedorId, fechaEstimadaLlegada, sitioDestinoId, lineas]
      properties:
        proveedorId: { type: number }
        referencia: { type: ["string", "null"] }
        fechaPedido: { anyOf: [{ $ref: "#/components/schemas/CalendarDate" }, { type: "null" }] }
        fechaEstimadaLlegada: { $ref: "#/components/schemas/CalendarDate" }
        sitioDestinoId: { type: number }
        notas: { type: ["string", "null"] }
        lineas:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ContenedorLineaInput" }
    ContenedorUpdate:
      allOf:
        - { $ref: "#/components/schemas/ContenedorInput" }
    ContenedorCancelacion:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 10 }
    ContenedorLinea:
      type: object
      required: [id, productoId, sku, tela, color, unidad, cantidadEsperada, rollosEsperados, nota, cantidadRecibida, rollosRecibidos, diferencia]
      properties:
        id: { type: ["number", "null"], description: Null when the product was received but was not expected }
        productoId: { type: number }
        sku: { type: string }
        tela: { type: string }
        color: { type: string }
        unidad: { type: string, enum: [METRO, KILO] }
        cantidadEsperada: { type: string }
        rollosEsperados: { type: ["number", "null"] }
        nota: { type: ["string", "null"] }
        cantidadRecibida: { type: string }
        rollosRecibidos: { type: number }
        diferencia: { type: string }
        costoTotal:
          type: ["string", "null"]
          description: Solo presente para ADMIN
        costoUnitarioReal:
          type: ["string", "null"]
          description: Costo ponderado por cantidad; solo presente para ADMIN
    ContenedorTotals:
      type: object
      required: [lineas, rollos, metros, kilos]
      properties:
        lineas: { type: number }
        rollos: { type: number }
        metros: { type: string }
        kilos: { type: string }
    ContenedorListItem:
      type: object
      required: [id, folio, proveedorId, proveedor, referencia, fechaEstimadaLlegada, sitioDestinoId, sitioDestino, estado, diasParaLlegar, lineas, totales]
      properties:
        id: { type: number }
        folio: { type: number }
        proveedorId: { type: number }
        proveedor: { type: string }
        referencia: { type: ["string", "null"] }
        fechaEstimadaLlegada: { $ref: "#/components/schemas/CalendarDate" }
        sitioDestinoId: { type: number }
        sitioDestino: { type: string }
        estado: { $ref: "#/components/schemas/EstadoContenedor" }
        diasParaLlegar: { type: number }
        lineas: { type: number }
        totales: { $ref: "#/components/schemas/ContenedorTotals" }
        costoTotal: { type: ["string", "null"], description: Solo ADMIN }
    ContenedorListResult:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContenedorListItem" }
        total: { type: number }
        page: { type: number }
        pageSize: { type: number }
    ContenedorDetail:
      type: object
      required: [id, folio, proveedorId, proveedor, referencia, fechaPedido, fechaEstimadaLlegada, fechaRealLlegada, sitioDestinoId, sitioDestino, entradaId, estado, notas, motivoCancelacion, usuarioId, createdAt, updatedAt, diasTransito, diferenciaFechaEstimada, totalesEsperados, totalesRecibidos, lineas]
      properties:
        id: { type: number }
        folio: { type: number }
        proveedorId: { type: number }
        proveedor: { type: string }
        referencia: { type: ["string", "null"] }
        fechaPedido: { anyOf: [{ $ref: "#/components/schemas/CalendarDate" }, { type: "null" }] }
        fechaEstimadaLlegada: { $ref: "#/components/schemas/CalendarDate" }
        fechaRealLlegada: { anyOf: [{ $ref: "#/components/schemas/CalendarDate" }, { type: "null" }] }
        sitioDestinoId: { type: number }
        sitioDestino: { type: string }
        entradaId: { type: ["number", "null"] }
        estado: { $ref: "#/components/schemas/EstadoContenedor" }
        notas: { type: ["string", "null"] }
        motivoCancelacion: { type: ["string", "null"] }
        usuarioId: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        diasTransito: { type: ["number", "null"] }
        diferenciaFechaEstimada: { type: ["number", "null"] }
        totalesEsperados: { $ref: "#/components/schemas/ContenedorTotals" }
        totalesRecibidos: { $ref: "#/components/schemas/ContenedorTotals" }
        lineas:
          type: array
          items: { $ref: "#/components/schemas/ContenedorLinea" }
        costoTotal: { type: ["string", "null"], description: Solo ADMIN }
    ContenedorEntradaOption:
      type: object
      required: [id, folio, proveedorId, proveedor, referencia, fechaEstimadaLlegada]
      properties:
        id: { type: number }
        folio: { type: number }
        proveedorId: { type: number }
        proveedor: { type: string }
        referencia: { type: ["string", "null"] }
        fechaEstimadaLlegada: { $ref: "#/components/schemas/CalendarDate" }
    ContenedorResumenKpis:
      type: object
      required: [enTransito, rollosPorLlegar, metrosPorLlegar, kilosPorLlegar, retrasados, proximo]
      properties:
        enTransito: { type: number }
        rollosPorLlegar: { type: number }
        metrosPorLlegar: { type: string }
        kilosPorLlegar: { type: string }
        retrasados: { type: number }
        proximo:
          anyOf:
            - $ref: "#/components/schemas/ContenedorResumenKpisProximo"
            - { type: "null" }
    ContenedorResumenKpisProximo:
      type: object
      required: [folio, proveedor, fechaEstimadaLlegada, dias]
      properties:
        folio: { type: number }
        proveedor: { type: string }
        fechaEstimadaLlegada: { $ref: "#/components/schemas/CalendarDate" }
        dias: { type: number }
    ContenedorAnaliticaRow:
      type: object
      additionalProperties: true
    ContenedorProveedorResumen:
      type: object
      required: [proveedorId, proveedor, contenedores, rollos, metros, kilos, diasPromedioTransito, antes, aTiempo, despues]
      properties:
        proveedorId: { type: number }
        proveedor: { type: string }
        contenedores: { type: number }
        rollos: { type: number }
        metros: { type: string }
        kilos: { type: string }
        diasPromedioTransito: { type: ["string", "null"] }
        antes: { type: number }
        aTiempo: { type: number }
        despues: { type: number }
        costoTotal: { type: ["string", "null"], description: Solo ADMIN }
        participacion: { type: ["string", "null"], description: Solo ADMIN }
    ContenedorPeriodoResumen:
      type: object
      required: [contenedores, rollos, metros, kilos, diasPromedio, antes, aTiempo, despues]
      properties:
        contenedores: { type: number }
        rollos: { type: number }
        metros: { type: string }
        kilos: { type: string }
        diasPromedio: { type: ["string", "null"] }
        antes: { type: number }
        aTiempo: { type: number }
        despues: { type: number }
        costoTotal: { type: ["string", "null"], description: Solo ADMIN; null cuando hay costos pendientes }
        costoPromedio: { type: ["string", "null"], description: Solo ADMIN; null cuando hay costos pendientes }
    ContenedorProductoResumen:
      type: object
      required: [productoId, sku, tela, color, unidad, contenedores, rollos, cantidad]
      properties:
        productoId: { type: number }
        sku: { type: string }
        tela: { type: string }
        color: { type: string }
        unidad: { type: string, enum: [METRO, KILO] }
        contenedores: { type: number }
        rollos: { type: number }
        cantidad: { type: string }
        costoTotal: { type: ["string", "null"], description: Solo ADMIN }
        costoUnitarioReal: { type: ["string", "null"], description: Solo ADMIN }
    ContenedorGrupoResumen:
      type: object
      required: [unidad, contenedores, rollos, metros, kilos]
      properties:
        tela: { type: string }
        color: { type: string }
        unidad: { type: string, enum: [METRO, KILO] }
        contenedores: { type: number }
        rollos: { type: number }
        metros: { type: string }
        kilos: { type: string }
        costoTotal: { type: ["string", "null"], description: Solo ADMIN }
        costoUnitarioReal: { type: ["string", "null"], description: Solo ADMIN }
    ContenedorMesResumen:
      type: object
      required: [mes]
      properties:
        mes: { type: number }
        costoActual: { type: ["string", "null"], description: Solo ADMIN; null cuando hay costos pendientes }
        costoAnioAnterior: { type: ["string", "null"], description: Solo ADMIN; null cuando hay costos pendientes }
    ContenedorDiferenciaResumen:
      type: object
      required: [producto_id, sku, tela, color, unidad, esperado, recibido]
      properties:
        producto_id: { type: number }
        sku: { type: string }
        tela: { type: string }
        color: { type: string }
        unidad: { type: string, enum: [METRO, KILO] }
        esperado: { type: string }
        recibido: { type: string }
    ContenedorResumen:
      type: object
      required: [actual, periodo, porProveedor, porProducto, porTela, porColor, porMes, diferencias]
      properties:
        actual: { $ref: "#/components/schemas/ContenedorResumenKpis" }
        periodo: { $ref: "#/components/schemas/ContenedorPeriodoResumen" }
        porProveedor: { type: array, items: { $ref: "#/components/schemas/ContenedorProveedorResumen" } }
        porProducto: { type: array, items: { $ref: "#/components/schemas/ContenedorProductoResumen" } }
        porTela: { type: array, items: { $ref: "#/components/schemas/ContenedorGrupoResumen" } }
        porColor: { type: array, items: { $ref: "#/components/schemas/ContenedorGrupoResumen" } }
        porMes: { type: array, items: { $ref: "#/components/schemas/ContenedorMesResumen" } }
        diferencias: { type: array, items: { $ref: "#/components/schemas/ContenedorDiferenciaResumen" } }
    ReportePrimitive:
      oneOf: [{ type: string }, { type: number }, { type: boolean }, { type: "null" }]
    ReporteKpi:
      type: object
      required: [id, label, value, kind]
      properties:
        id: { type: string }
        label: { type: string }
        value: { $ref: "#/components/schemas/ReportePrimitive" }
        kind: { type: string, enum: [money, quantity, count, percentage, days] }
        unit: { type: string }
        comparisonPrevious: { type: number, nullable: true }
        comparisonYearAgo: { type: number, nullable: true }
        estimated: { type: boolean }
        economic: { type: boolean }
    ReporteChart:
      type: object
      required: [id, title, type, categoryKey, series, rows]
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string, enum: [line, bar, stacked-bar, heatmap, treemap, scatter] }
        categoryKey: { type: string }
        series: { type: array, items: { type: object, required: [key, label], properties: { key: { type: string }, label: { type: string }, kind: { type: string }, economic: { type: boolean }, estimated: { type: boolean } } } }
        rows: { type: array, items: { type: object, additionalProperties: { $ref: "#/components/schemas/ReportePrimitive" } } }
    ReporteTable:
      type: object
      required: [id, title, columns, rows, totals]
      properties:
        id: { type: string }
        title: { type: string }
        columns: { type: array, items: { type: object, required: [key, label, kind], properties: { key: { type: string }, label: { type: string }, kind: { type: string }, economic: { type: boolean }, estimated: { type: boolean } } } }
        rows: { type: array, items: { type: object, additionalProperties: { $ref: "#/components/schemas/ReportePrimitive" } } }
        totals: { type: object, additionalProperties: { $ref: "#/components/schemas/ReportePrimitive" } }
    ReporteSeccion:
      type: object
      required: [section, generatedAt, hasEconomicAccess, range, activeFilters, warnings, kpis, charts, tables]
      properties:
        section: { type: string }
