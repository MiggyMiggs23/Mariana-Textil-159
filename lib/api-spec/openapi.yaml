          type: object
          required: [vendido, porCobrar, cobrado, previousDesde, previousHasta]
          properties:
            vendido:
              type: object
              required: [contado, credito, total, totalAnterior, variacionPorcentaje]
              properties:
                contado: { type: string }
                credito: { type: string }
                total: { type: string }
                totalAnterior: { type: ["string", "null"] }
                variacionPorcentaje: { type: ["string", "null"] }
            porCobrar:
              type: object
              required: [periodo, periodoAnterior, variacionPorcentaje]
              properties:
                periodo: { type: string, description: Notas de venta a crédito creadas en el periodo; no es saldo de cartera. }
                periodoAnterior: { type: ["string", "null"] }
                variacionPorcentaje: { type: ["string", "null"] }
            cobrado:
              type: object
              required: [contado, abonos, saldosFavor, total, totalAnterior, variacionPorcentaje]
              properties:
                contado: { type: string, description: Cobranza POS; también forma parte de Vendido. }
                abonos: { type: string }
                saldosFavor: { type: string }
                total: { type: string }
                totalAnterior: { type: ["string", "null"] }
                variacionPorcentaje: { type: ["string", "null"] }
            previousDesde: { type: ["string", "null"], format: date-time }
            previousHasta: { type: ["string", "null"], format: date-time }
        cobrosAnteriores:
          type: array
