      type: object
      required: [id, title, columns, rows, totals]
      properties:
        id: { type: string }
        title: { type: string }
        columns:
          {
            type: array,
            items:
              {
                type: object,
                required: [key, label, kind],
                properties:
                  {
                    key: { type: string },
                    label: { type: string },
                    kind: { type: string },
                    hrefKey:
                      {
                        type: string,
                        description: Row field containing the URL for this column,
                      },
                    economic: { type: boolean },
                    estimated: { type: boolean },
                  },
              },
          }
        rows:
          {
            type: array,
            items:
              {
                type: object,
                additionalProperties:
                  { $ref: "#/components/schemas/ReportePrimitive" },
              },
          }
        totals:
          {
            type: object,
            additionalProperties:
              { $ref: "#/components/schemas/ReportePrimitive" },
          }
