        importeRecibido: { $ref: "#/components/schemas/E5Money" }
        importeAplicar: { $ref: "#/components/schemas/E5Money" }
        pendienteResultante: { $ref: "#/components/schemas/E5Money" }
        notas: { type: array, items: { $ref: "#/components/schemas/E5Nota" } }
