        saldo: { type: string, pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}$' }
    E11FinanzasClientes:
      type: object
      additionalProperties: false
      required: [items, nextCursor, fuenteRevision]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/E11FinanzasCliente" } }
        nextCursor: { type: [string, "null"] }
        fuenteRevision: { type: string }
    E11FinanzasNota:
      type: object
      additionalProperties: false
      required: [notaId, movimientoVentaId, folio, clienteId, fecha, facturada, total, saldo]
      properties:
        notaId: { type: integer }
        movimientoVentaId: { type: integer, description: Identidad exacta del cargo E5, no deducirla del ticket }
        folio: { type: string }
        clienteId: { type: integer }
        fecha: { type: string, format: date-time }
        facturada: { type: boolean }
        total: { $ref: "#/components/schemas/E5Money" }
        saldo: { $ref: "#/components/schemas/E5Money" }
    E11FinanzasNotas:
      type: object
      additionalProperties: false
      required: [items, nextCursor, fuenteRevision]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/E11FinanzasNota" } }
        nextCursor: { type: [string, "null"] }
        fuenteRevision: { type: string }
    E11Movimiento:
      type: object
      additionalProperties: false
      required: [id, tipo, fechaEfectiva, importe, notaId]
