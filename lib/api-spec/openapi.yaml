        ubicacionId: { type: number }
        nombreUbicacion: { type: string }
        estado: { type: string, enum: [ABIERTA, CERRADA, CANCELADA, CONFIRMADA] }
        totalSnapshot: { type: number }
        totalEscaneados: { type: number }
        cuadros: { type: number }
        faltantes: { type: number }
        sobrantes: { type: number }
        malAcomodados: { type: number }
        abiertaAt: { type: string, format: date-time }
        creadaPor: { type: string }
    AuditoriaInventarioResultado:
      type: object
      required: [serie, clasificacion, cantidad, unidad, estadoActual, resolucion]
      properties:
        serie: { type: string }
        clasificacion: { type: string, enum: [CUADRO, FALTANTE, SOBRANTE, MAL_ACOMODADO] }
        rolloId: { type: [number, "null"] }
        producto: { type: [string, "null"] }
        cantidad: { type: [string, "null"], pattern: '^-?\d+(\.\d{1,3})?$' }
        unidad: { type: [string, "null"] }
        ubicacionActualId: { type: [number, "null"] }
        ubicacionActual: { type: [string, "null"] }
        pisoEsperadoId: { type: ["number", "null"] }
        pisoEsperado: { type: ["string", "null"] }
        pisoRealId: { type: ["number", "null"] }
        pisoReal: { type: ["string", "null"] }
        estadoActual: { type: string }
        resolucion: { type: string, enum: [PENDIENTE, APLICADA, RESOLUCION_MANUAL] }
        escaneadoAt: { type: [string, "null"], format: date-time }
        sobrante:
          oneOf:
            - $ref: "#/components/schemas/AuditoriaSobranteContexto"
            - type: "null"
    AuditoriaSobranteResolucionInput:
      type: object
      required: [serie, decision, motivo, uuidCliente]
      properties:
        serie: { type: string, minLength: 1, maxLength: 100 }
        decision: { type: string, enum: [DEJAR, REGRESAR, INVESTIGAR] }
        motivo: { type: string, minLength: 10, maxLength: 1000 }
        uuidCliente: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' }
        transportista: { type: string, maxLength: 200 }
        pisoId: { type: [number, "null"] }
    AuditoriaDocumentoRelacionado:
      type: object
      required: [tipo, id, folio, href]
      properties:
        tipo: { type: string }
        id: { type: number }
        folio: { type: string }
        href: { type: string }
    AuditoriaSobranteDecision:
      type: object
      required: [id, decision, motivo, usuarioId, usuario, createdAt, salidaId]
      properties:
        id: { type: number }
        decision: { type: string }
        motivo: { type: string }
        usuarioId: { type: number }
        usuario: { type: string }
        createdAt: { type: string, format: date-time }
        salidaId: { type: [number, "null"] }
    AuditoriaSobranteContexto:
      type: object
      required: [caso, grave, sitioRegistradoId, sitioRegistrado, estadoRegistrado, documentos, pendiente, estadoResolucion, bloqueo, historial]
      properties:
        caso: { type: string, enum: [DISPONIBLE_OTRO_SITIO, EN_TRANSITO_HACIA_SITIO, APARTADO_SALIDA_ABIERTA, VENDIDO_FISICAMENTE_AQUI, SIN_REGISTRO_PREVIO, REQUIERE_INVESTIGACION] }
        grave: { type: boolean }
        sitioRegistradoId: { type: [number, "null"] }
        sitioRegistrado: { type: [string, "null"] }
        estadoRegistrado: { type: [string, "null"] }
        documentos: { type: array, items: { $ref: "#/components/schemas/AuditoriaDocumentoRelacionado" } }
        pendiente: { type: boolean }
        estadoResolucion: { type: string, enum: [PENDIENTE, EN_INVESTIGACION, EN_TRANSITO, RESUELTO] }
        bloqueo: { type: [string, "null"] }
        historial: { type: array, items: { $ref: "#/components/schemas/AuditoriaSobranteDecision" } }
    ReactivacionFaltanteInput:
      type: object
      required: [auditoriaOrigenId, origen, ubicacionId, pisoId, motivo, uuidCliente]
      properties:
        auditoriaOrigenId: { type: number, minimum: 1 }
        origen: { type: string, enum: [AUDITORIA, ROLLO] }
        ubicacionId: { type: number, minimum: 1 }
        pisoId: { type: [number, "null"], minimum: 1 }
        motivo: { type: string, minLength: 10, maxLength: 1000 }
        uuidCliente: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' }
    ReactivacionAuditoriaPosterior:
      type: object
      required: [id, ubicacionId, folio, cerradaAt]
      properties:
        id: { type: number }
        ubicacionId: { type: number }
        folio: { type: number }
        cerradaAt: { type: string, format: date-time }
    ReactivacionFaltanteContexto:
      type: object
      required: [rolloId, serie, elegible, bloqueo, auditoriaOrigenId, movimientoBajaId, cantidadAnterior, producto, unidad, costoUnitario, recepcionId, entradaFolio, proveedorId, proveedorNombre, ubicacionBajaId, ubicacionBaja, auditoriasPosteriores]
      properties:
        rolloId: { type: number }
        serie: { type: string }
        elegible: { type: boolean }
        bloqueo: { type: [string, "null"] }
        auditoriaOrigenId: { type: [number, "null"] }
        movimientoBajaId: { type: [number, "null"] }
        cantidadAnterior: { type: [string, "null"] }
        producto: { type: string }
        unidad: { type: string }
        costoUnitario: { type: [string, "null"] }
        recepcionId: { type: [number, "null"] }
        entradaFolio: { type: [string, "null"] }
        proveedorId: { type: [number, "null"] }
        proveedorNombre: { type: [string, "null"] }
        ubicacionBajaId: { type: [number, "null"] }
        ubicacionBaja: { type: [string, "null"] }
        auditoriasPosteriores: { type: array, items: { $ref: "#/components/schemas/ReactivacionAuditoriaPosterior" } }
    AuditoriaInventarioParticipante:
      type: object
      required: [usuarioId, nombre, escaneos, primeroAt, ultimoAt]
      properties:
        usuarioId: { type: number }
        nombre: { type: string }
        escaneos: { type: number }
        primeroAt: { type: string, format: date-time }
        ultimoAt: { type: string, format: date-time }
    AuditoriaInventarioDetail:
      allOf:
        - $ref: "#/components/schemas/AuditoriaInventarioResumen"
        - type: object
          required: [resultados, participantes]
          properties:
            motivoCancelacion: { type: [string, "null"] }
            cerradaAt: { type: [string, "null"], format: date-time }
            confirmadaAt: { type: [string, "null"], format: date-time }
            resultados:
              type: array
              items: { $ref: "#/components/schemas/AuditoriaInventarioResultado" }
            participantes:
              type: array
              items: { $ref: "#/components/schemas/AuditoriaInventarioParticipante" }
    AuditoriaInventarioEscaneoResult:
      type: object
      required: [serie, duplicado, clasificacion, estadoActual]
      properties:
        serie: { type: string }
        duplicado: { type: boolean }
        clasificacion: { type: string, enum: [CUADRO, SOBRANTE] }
        estadoActual: { type: string }
