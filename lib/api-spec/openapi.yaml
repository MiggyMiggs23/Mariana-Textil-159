        revisionEsperada: { type: integer, minimum: 1 }
        peticionCliente: { type: string, minLength: 1, maxLength: 2000 }
        evidencia: { $ref: "#/components/schemas/E5Evidencia" }
        fuente: { $ref: "#/components/schemas/E5FuenteDevolucion" }
    E5Propuesta:
