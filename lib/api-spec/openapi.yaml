          schema: { type: string, enum: [COBRADO, CREDITO, PENDIENTE, CANCELADAS, SALIDAS_EN_TRANSITO, SALIDAS_CANCELADAS] }
        - $ref: "#/components/parameters/AnalyticsDesde"
        - $ref: "#/components/parameters/AnalyticsHasta"
        - $ref: "#/components/parameters/AnalyticsUbicacionId"
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
