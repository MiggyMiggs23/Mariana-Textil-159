        tipo: { type: string, enum: [VENTA, ABONO, REVERSO, AJUSTE] }
        fechaEfectiva: { type: string, format: date }
        importe: { type: string, pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}$' }
