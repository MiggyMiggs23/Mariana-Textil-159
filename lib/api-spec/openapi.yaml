            content:
              {
                application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
                  { schema: { type: string, format: binary } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /reportes/{seccion}/export.pdf:
    get:
      operationId: exportReporteSeccionPdf
      tags: [reportes]
      summary: Exporta un reporte a PDF
      parameters:
        - name: seccion
          in: path
          required: true
          schema:
            {
              type: string,
              enum:
                [
                  ventas,
                  utilidad,
                  inventario,
                  mapas-calor,
                  color,
                  compras,
                  clientes,
                  pagos-dirigidos,
                ],
            }
        - $ref: "#/components/parameters/ReportePeriodo"
        - $ref: "#/components/parameters/AnalyticsDesde"
        - $ref: "#/components/parameters/AnalyticsHasta"
        - $ref: "#/components/parameters/ReporteUbicacionIds"
        - $ref: "#/components/parameters/ReporteProductoIds"
        - $ref: "#/components/parameters/ReporteTelas"
        - $ref: "#/components/parameters/ReporteColores"
        - $ref: "#/components/parameters/ReporteUnidades"
        - $ref: "#/components/parameters/ReporteUsuarioIds"
        - $ref: "#/components/parameters/ReporteClienteIds"
        - $ref: "#/components/parameters/ReporteProveedorIds"
        - $ref: "#/components/parameters/ReporteFormasPago"
        - $ref: "#/components/parameters/ReporteFacturado"
        - $ref: "#/components/parameters/ReporteModalidad"
        - $ref: "#/components/parameters/ReporteMargenUmbral"
        - $ref: "#/components/parameters/ReporteCoberturaCritico"
        - $ref: "#/components/parameters/ReporteCoberturaBajo"
        - $ref: "#/components/parameters/ReporteCoberturaNormal"
        - $ref: "#/components/parameters/ReporteCoberturaExceso"
      responses:
        "200":
          {
            description: Archivo PDF,
            content:
              { application/pdf: { schema: { type: string, format: binary } } },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auditoria:
    get:
      operationId: listAuditoria
      tags: [auditoria]
      summary: Lista la auditoría newest-first para usuarios con permiso
      parameters:
        - {
            in: query,
            name: desde,
            schema: { $ref: "#/components/schemas/CalendarDate" },
          }
        - {
            in: query,
            name: hasta,
            schema: { $ref: "#/components/schemas/CalendarDate" },
          }
        - { in: query, name: usuarioId, schema: { type: number, minimum: 1 } }
        - {
            in: query,
            name: rol,
            schema: { $ref: "#/components/schemas/Role" },
          }
        - { in: query, name: modulo, schema: { type: string, maxLength: 80 } }
        - { in: query, name: accion, schema: { type: string, maxLength: 80 } }
        - { in: query, name: sitioId, schema: { type: number, minimum: 1 } }
        - { in: query, name: search, schema: { type: string, maxLength: 150 } }
        - {
            in: query,
            name: page,
            schema: { type: number, minimum: 1, default: 1 },
          }
        - {
            in: query,
            name: pageSize,
            schema: { type: number, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        "200":
          description: Resultado paginado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditoriaListResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auditoria/export.xlsx:
    get:
      operationId: exportAuditoriaXlsx
      tags: [auditoria]
      summary: Exporta el resultado filtrado completo con límite conservador
      parameters:
        - {
            in: query,
            name: desde,
            schema: { $ref: "#/components/schemas/CalendarDate" },
          }
        - {
            in: query,
            name: hasta,
            schema: { $ref: "#/components/schemas/CalendarDate" },
          }
        - { in: query, name: usuarioId, schema: { type: number, minimum: 1 } }
        - {
            in: query,
            name: rol,
            schema: { $ref: "#/components/schemas/Role" },
          }
        - { in: query, name: modulo, schema: { type: string, maxLength: 80 } }
        - { in: query, name: accion, schema: { type: string, maxLength: 80 } }
        - { in: query, name: sitioId, schema: { type: number, minimum: 1 } }
        - { in: query, name: search, schema: { type: string, maxLength: 150 } }
      responses:
        "200":
          description: Archivo XLSX (máximo 10000 filas)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auditoria/{id}:
    get:
      operationId: getAuditoria
      tags: [auditoria]
      summary: Obtiene detalle y evidencia antes/después para usuarios con permiso
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: number, minimum: 1 },
          }
      responses:
        "200":
          description: Detalle de auditoría
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditoriaDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /viajes/catalogo-operativo:
    get:
      operationId: getViajesOperationalCatalog
      tags: [viajes]
      summary: Catálogo activo de transporte para crear viajes
      responses:
        "200":
          description: Vehículos, choferes y sitios operativos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViajesOperationalCatalog" }
  /viajes/elegibles:
    get:
      operationId: listViajesEligibleDocuments
      tags: [viajes]
      parameters:
        - { in: query, name: origenId, schema: { type: number } }
        - { in: query, name: search, schema: { type: string } }
      responses:
        "200":
          description: Notas y salidas sin viaje
          content: { application/json: { schema: { $ref: "#/components/schemas/ViajesEligibleDocuments" } } }
  /viajes:
    get:
      operationId: listViajes
      tags: [viajes]
      parameters:
        - { in: query, name: fechaDesde, schema: { type: string, format: date-time } }
        - { in: query, name: fechaHasta, schema: { type: string, format: date-time } }
        - { in: query, name: camionetaId, schema: { type: number } }
        - { in: query, name: choferId, schema: { type: number } }
        - { in: query, name: origenId, schema: { type: number } }
        - { in: query, name: destino, schema: { type: string } }
      responses:
        "200": { description: Viajes, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ViajeSummary" } } } } }
    post:
      operationId: createViaje
      tags: [viajes]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ViajeInput" } } }
      responses:
        "201": { description: Viaje creado, content: { application/json: { schema: { $ref: "#/components/schemas/ViajeDetail" } } } }
  /viajes/{id}:
    get:
      operationId: getViaje
      tags: [viajes]
      parameters: [{ name: id, in: path, required: true, schema: { type: number, minimum: 1 } }]
      responses:
        "200": { description: Detalle de viaje, content: { application/json: { schema: { $ref: "#/components/schemas/ViajeDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /purga/{entidad}/{id}/preflight:
    get:
      operationId: getPurgaPreflight
      tags: [users, productos, proveedores, clientes]
      summary: Cuenta referencias antes de purgar un registro inactivo (solo ADMIN)
      parameters:
        - $ref: "#/components/parameters/PurgaEntidad"
        - $ref: "#/components/parameters/PurgaId"
      responses:
        "200":
          description: Resultado del preflight
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgaPreflight" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /purga/{entidad}/{id}:
    delete:
      operationId: deleteRegistroInactivo
      tags: [users, productos, proveedores, clientes]
      summary: Purga definitivamente un registro sin referencias (solo ADMIN)
      description: Los productos requieren credenciales de un ADMIN activo; los demás catálogos conservan la confirmación por texto exacto.
      parameters:
        - $ref: "#/components/parameters/PurgaEntidad"
        - $ref: "#/components/parameters/PurgaId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurgaConfirmacion" }
      responses:
        "200":
          description: Registro purgado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgaResultado" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Las credenciales no pertenecen a un ADMIN activo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Registro bloqueado, confirmación incorrecta o referencias existentes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgaConflicto" }
components:
  parameters:
    PurgaEntidad:
      name: entidad
      in: path
      required: true
      schema:
        type: string
        enum: [usuarios, camionetas, choferes, clientes, proveedores, productos]
    PurgaId:
      name: id
      in: path
      required: true
      schema: { type: number, minimum: 1 }
    CamionetaId:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: number, minimum: 1 },
      }
    ChoferId:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: number, minimum: 1 },
      }
    ReportePeriodo:
      name: periodo
      in: query
      schema:
        {
          type: string,
          enum:
            [
              diario,
              semanal,
              mensual,
              trimestral,
              semestral,
              anual,
              personalizado,
            ],
          default: mensual,
        }
    ReporteUbicacionIds:
      { name: ubicacionIds, in: query, schema: { type: string } }
    ReporteProductoIds:
      { name: productoIds, in: query, schema: { type: string } }
    ReporteTelas: { name: telas, in: query, schema: { type: string } }
    ReporteColores: { name: colores, in: query, schema: { type: string } }
    ReporteUnidades: { name: unidades, in: query, schema: { type: string } }
    ReporteUsuarioIds: { name: usuarioIds, in: query, schema: { type: string } }
    ReporteClienteIds: { name: clienteIds, in: query, schema: { type: string } }
    ReporteProveedorIds:
      { name: proveedorIds, in: query, schema: { type: string } }
    ReporteFormasPago: { name: formasPago, in: query, schema: { type: string } }
    ReporteFacturado: { name: facturado, in: query, schema: { type: boolean } }
    ReporteModalidad:
      name: modalidad
      in: query
      description: Modalidad de las líneas de venta; Todo no restringe resultados.
      schema: { type: string, enum: [TODO, ROLLOS, METRAJE], default: TODO }
    ReporteMargenUmbral:
      { name: margenUmbral, in: query, schema: { type: number, default: 15 } }
    ReporteCoberturaCritico:
      {
        name: coberturaCritico,
        in: query,
        schema: { type: number, default: 7 },
      }
    ReporteCoberturaBajo:
      { name: coberturaBajo, in: query, schema: { type: number, default: 15 } }
    ReporteCoberturaNormal:
      {
        name: coberturaNormal,
        in: query,
        schema: { type: number, default: 60 },
      }
    ReporteCoberturaExceso:
      {
        name: coberturaExceso,
        in: query,
        schema: { type: number, default: 90 },
      }
    AnalyticsDesde:
      name: desde
      in: query
      schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      description: Día inicial en America/Mexico_City
    AnalyticsHasta:
      name: hasta
      in: query
      schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      description: Día final en America/Mexico_City
    AnalyticsUbicacionId:
      name: ubicacionId
      in: query
      schema: { type: number }
    AccountDestination:
      name: cuentaDestino
      in: path
      required: true
      schema:
        type: string
        enum: [CAJA_FISICA, CUENTA_NO_FISCAL, CUENTA_FISCAL, CUENTAS_POR_COBRAR]
    LocationId:
      name: id
      in: path
      required: true
      schema:
        type: number
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ProductoId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ProveedorId:
      name: id
      in: path
      required: true
      schema:
        type: number
    RolloId:
      name: id
      in: path
      required: true
      schema:
        type: number
    MovimientoId:
      name: id
      in: path
      required: true
      schema:
        type: number
    EntradaId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ContenedorId:
      name: id
      in: path
      required: true
      schema:
        type: number
    SalidaId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ClienteId:
      name: id
      in: path
      required: true
      schema:
        type: number
    TicketId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ClienteTicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: number
    ClientePagoId:
      name: pagoId
      in: path
      required: true
      schema:
        type: number
    SesionCajaId:
      name: id
      in: path
      required: true
      schema:
        type: number
    NotificacionId:
      name: id
      in: path
      required: true
      schema:
        type: number
  responses:
    SalidaDetailResponse:
      description: Estado actualizado de la salida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SalidaDetail"
    Unauthorized:
      description: Sesión no válida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sin permisos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Demasiados intentos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    PurgaReferencia:
      type: object
      required: [tipo, cantidad]
      properties:
        tipo: { type: string }
        cantidad: { type: number }
    PurgaPreflight:
      type: object
      required: [entidad, id, nombreVisible, inactivo, referencias, totalReferencias, puedeEliminar]
      properties:
        entidad:
          type: string
          enum: [usuarios, camionetas, choferes, clientes, proveedores, productos]
        id: { type: number }
        nombreVisible: { type: string }
        inactivo: { type: boolean }
        referencias:
          type: array
          items: { $ref: "#/components/schemas/PurgaReferencia" }
        totalReferencias: { type: number }
        puedeEliminar: { type: boolean }
        motivoBloqueo: { type: [string, "null"] }
    PurgaConfirmacion:
      oneOf:
        - $ref: "#/components/schemas/PurgaConfirmacionTexto"
        - $ref: "#/components/schemas/PurgaCredencialesAdmin"
    PurgaConfirmacionTexto:
      type: object
      additionalProperties: false
      required: [confirmacion]
      properties:
        confirmacion: { type: string, minLength: 1 }
    PurgaCredencialesAdmin:
      type: object
      additionalProperties: false
      required: [usuario, password]
      properties:
        usuario: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 200 }
    PurgaResultado:
      type: object
      required: [eliminado]
      properties:
        eliminado: { type: boolean, enum: [true] }
    PurgaConflicto:
      type: object
      required: [error, referencias, totalReferencias]
      properties:
        error: { type: string }
        referencias:
          type: array
          items: { $ref: "#/components/schemas/PurgaReferencia" }
        totalReferencias: { type: number }
    MotivoRechazoPagoDirigidoInput:
      type: object
      required: [motivoRechazo]
      properties:
        motivoRechazo: { type: string, minLength: 10 }
    SolicitudesPagoDirigidoResult:
      type: object
      required: [solicitudes]
      properties:
        solicitudes:
          type: array
          items: { $ref: "#/components/schemas/SolicitudPagoDirigido" }
    SolicitudPagoDirigidoInput:
      type: object
      required:
        [tipo, entidadId, documentoMovimientoId, importe, formaPago, motivo]
      properties:
        tipo: { type: string, enum: [CLIENTE, PROVEEDOR] }
        entidadId: { type: number, minimum: 1 }
        documentoMovimientoId: { type: number, minimum: 1 }
        importe: { type: number, exclusiveMinimum: 0 }
        formaPago: { type: string, minLength: 1 }
        cuentaDestino: { type: string }
        fechaEfectiva: { type: string, format: date-time }
        referencia: { type: string }
        notas: { type: string }
        motivo: { type: string, minLength: 10 }
    SolicitudPagoDirigido:
      type: object
      required:
        [
          id,
          tipo,
          entidadId,
          documentoMovimientoId,
          importe,
          formaPago,
          motivo,
          solicitanteId,
          solicitanteNombre,
          contraparteNombre,
          documentoFolio,
          ubicacionId,
          ubicacionNombre,
          estado,
          createdAt,
        ]
      properties:
        id: { type: number }
        tipo: { type: string, enum: [CLIENTE, PROVEEDOR] }
        entidadId: { type: number }
        documentoMovimientoId: { type: number }
        importe: { type: string }
        formaPago: { type: string }
        cuentaDestino: { type: ["string", "null"] }
        fechaEfectiva: { type: ["string", "null"], format: date-time }
        referencia: { type: ["string", "null"] }
        notas: { type: ["string", "null"] }
        motivo: { type: string }
        motivoRechazo: { type: ["string", "null"] }
        solicitanteId: { type: number }
        solicitanteNombre: { type: string }
        autorizadorId: { type: ["number", "null"] }
        autorizadorNombre: { type: ["string", "null"] }
        contraparteNombre: { type: string }
        documentoFolio: { type: string }
        ubicacionId: { type: ["number", "null"] }
        ubicacionNombre: { type: ["string", "null"] }
        movimientoId: { type: ["number", "null"] }
        estado: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA] }
        createdAt: { type: string, format: date-time }
    SolicitudPagoDirigidoAplicada:
      type: object
      required: [solicitudId, movimientoId, estado]
      properties:
        solicitudId: { type: number }
        movimientoId: { type: number }
        estado: { type: string, enum: [APROBADA] }
    AuditoriaEntry:
      type: object
      required:
        [
          id,
          fecha,
          usuarioId,
          usuario,
          rolSnapshot,
          accion,
          modulo,
          entidad,
          entidadId,
          sitioId,
          sitio,
          ip,
        ]
      properties:
        id: { type: string }
        fecha: { type: string, format: date-time }
        usuarioId: { type: ["number", "null"] }
        usuario: { type: ["string", "null"] }
        rolSnapshot: { type: ["string", "null"] }
        accion: { type: string }
        modulo: { type: ["string", "null"] }
        entidad: { type: string }
        entidadId: { type: ["string", "null"] }
        sitioId: { type: ["number", "null"] }
        sitio: { type: ["string", "null"] }
        ip: { type: string }
    AuditoriaDetail:
      allOf:
        - { $ref: "#/components/schemas/AuditoriaEntry" }
        - type: object
          required: [datosAntes, datosDespues]
          properties:
            datosAntes: { type: ["object", "null"], additionalProperties: true }
            datosDespues:
              { type: ["object", "null"], additionalProperties: true }
    AuditoriaListResult:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditoriaEntry" }
        total: { type: number }
        page: { type: number }
        pageSize: { type: number }
    CalendarDate:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      description: Calendar day in YYYY-MM-DD; never coerced to an instant.
    EstadoContenedor:
      type: string
      enum: [EN_TRANSITO, RECIBIDO, CANCELADO]
    ContenedorCatalogoProducto:
      type: object
      required: [id, sku, tela, color, unidad]
      properties:
        id: { type: number }
        sku: { type: string }
        tela: { type: string }
        color: { type: string }
