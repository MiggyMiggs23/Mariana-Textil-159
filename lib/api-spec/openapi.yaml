      required: [claveOperacion, revisionEsperada, propuestaId, motivo]
      properties:
        claveOperacion: { type: string, format: uuid }
        revisionEsperada: { type: integer, minimum: 1 }
        propuestaId: { type: string, format: uuid }
        motivo: { type: string, minLength: 1, maxLength: 2000 }
    E5FuenteDevolucion:
