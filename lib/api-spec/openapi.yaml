      properties:
        facturaId: { type: integer }
        ventaId: { type: integer }
        folioFactura: { type: string }
        cliente: { $ref: "#/components/schemas/E11FiscalCliente" }
        fechaFacturacion: { type: string, format: date-time }
        totalFacturado: { $ref: "#/components/schemas/E5Money" }
        moneda: { type: string, enum: [MXN] }
        estado: { type: string, enum: [VIGENTE, CANCELADA] }
