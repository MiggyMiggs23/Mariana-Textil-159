        asignaciones: { type: array, items: { $ref: "#/components/schemas/E5Asignacion" } }
        fechaAplicacion: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/E5Actor" }
        evidencia: { $ref: "#/components/schemas/E5Evidencia" }
        constanciaId: { type: string, format: uuid }
    E5Rechazo:
      type: object
      required: [propuestaId, motivo, actor, createdAt]
      properties:
        propuestaId: { type: string, format: uuid }
