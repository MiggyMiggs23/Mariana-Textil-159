    get:
      operationId: buscarRollosEtiquetas
      tags: [etiquetas]
      summary: Busca hasta 50 rollos respetando el alcance de sitio
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 150 } }
        - { in: query, name: sitioId, schema: { type: number } }
        - { in: query, name: estado, schema: { $ref: "#/components/schemas/EstadoRollo" } }
        - { in: query, name: productoId, schema: { type: number } }
        - { in: query, name: fechaDesde, schema: { type: string, format: date } }
        - { in: query, name: fechaHasta, schema: { type: string, format: date } }
        - { in: query, name: folio, schema: { type: number } }
      responses:
        "200":
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, total]
                properties:
                  items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/RolloEtiqueta" } }
                  limit: { type: number, const: 50 }
                  total: { type: number }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /etiquetas/rollos/{id}:
    get:
      operationId: obtenerRolloEtiqueta
      tags: [etiquetas]
      summary: Obtiene un rollo y su contador de reimpresiones
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      responses:
        "200":
          description: Detalle para etiqueta
          content: { application/json: { schema: { $ref: "#/components/schemas/RolloEtiqueta" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /etiquetas/reimpresiones:
    post:
      operationId: crearReimpresionEtiquetas
      tags: [etiquetas]
      summary: Registra y devuelve de una a 50 etiquetas para imprimir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rolloIds, motivo]
              properties:
                rolloIds: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: number } }
                motivo: { type: string, minLength: 10, maxLength: 1000 }
                adminUsuario: { type: string }
                adminPassword: { type: string, format: password, writeOnly: true }
      responses:
        "201":
          description: Etiquetas registradas
          content:
            application/json:
              schema:
                type: object
                required: [etiquetas, registradoAt]
                properties:
                  etiquetas: { type: array, items: { $ref: "#/components/schemas/EtiquetaImprimible" } }
                  registradoAt: { type: string, format: date-time }
        "400":
          description: Solicitud inválida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
