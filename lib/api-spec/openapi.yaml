openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API para el sistema interno de Mariana Textil.
servers:
  - url: /api
    description: Base API path
x-e11-gates:
  E11_ENABLED: false
  E11_UI_ENABLED: false
  E11_PROFILE_ASSIGNMENT_ENABLED: false
  E11_RECONCILIATION_ENABLED: false
  E11_E5_PREPARATION_ENABLED: false
  description: Contrato solamente; ninguna puerta activa implementación, migración o permisos.
x-e7-gates:
  E7_ENABLED: true
  E7_CLIENT_FINANCIAL_READS_ENABLED: true
  E7_ATTRIBUTION_ENABLED: false
  E7_E5_READ_SOURCE_ENABLED: true
  description: Lecturas financieras de clientes ON; atribución y operaciones E5 permanecen OFF.
tags:
  - name: e7
    description: Lecturas financieras de clientes; atribución operativa cerrada
  - name: e11
    description: Contrato OFF de perfiles CONTADOR A/F, lectores dedicados y conciliación facturada
  - name: e9
    description: Contrato preparado OFF de entregas completas y recepción ADMIN
  - name: health
    description: Health operations
  - name: auth
    description: Sesión y acceso
  - name: dashboard
    description: Datos del tablero inicial
  - name: locations
    description: Administración de ubicaciones
  - name: users
    description: Administración de usuarios
  - name: productos
    description: Catálogo de productos/telas
  - name: precios
    description: Consulta y administración de precios según permisos efectivos
  - name: proveedores
    description: Administración de proveedores
  - name: clientes
    description: Catálogo operativo de clientes
  - name: permisos
    description: Administración de permisos por rol y por usuario
  - name: inventario
    description: Inventario de rollos, kardex, ajustes y conciliación
  - name: stock-minimos
    description: Configuración de mínimos de inventario por producto y ubicación
  - name: auditoria-inventario
    description: Conteos físicos de rollos por sitio
  - name: pos
    description: Punto de venta y búsqueda para terminal
  - name: caja
    description: Apertura, cobro y corte de caja
  - name: salidas
    description: Salidas entre ubicaciones y retiros completos a mostrador
  - name: admin-analytics
    description: Analítica financiera y operativa exclusiva para ADMIN
  - name: notificaciones
    description: Notificaciones dirigidas al usuario y alertas de crédito exclusivas para ADMIN
  - name: etiquetas
    description: Búsqueda y reimpresión controlada de etiquetas de rollos
  - name: contenedores
    description: Próximos contenedores y control anual de compras
  - name: auditoria
    description: Consulta por permiso de la bitácora inmutable
  - name: camionetas
    description: Catálogo histórico de camionetas para operaciones de transporte
  - name: choferes
    description: Catálogo histórico de choferes para operaciones de transporte
  - name: viajes
    description: Hojas históricas de despacho de documentos
  - name: equipos
    description: Registro de equipo del sistema y su configuración por sitio
paths:
  /inventario/rollos/{id}/remate:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getRolloRemate
      responses:
        "200":
          description: Estado vigente del remate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolloRemate" }
    post:
      operationId: marcarRolloRemate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolloRemateInput" }
      responses:
        "201":
          description: Marca auditada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolloRemate" }
    delete:
      operationId: retirarRolloRemate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolloRemateInput" }
      responses:
        "201":
          description: Retiro ADMIN auditado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolloRemate" }
  /e7/disponibilidad:
    get:
      operationId: getE7Disponibilidad
      tags: [e7]
      responses:
        "200":
          description: Gates de fuente; no consulta DB
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, clienteFinanzas, atribucion]
                properties:
                  enabled: { type: boolean }
                  clienteFinanzas: { type: boolean }
                  atribucion: { type: boolean }
  /e7/atribucion:
    get:
      operationId: getE7Atribucion
      tags: [e7]
      description: >
        ADMIN/SISTEMAS según lectura Cuentas Destino; no concede acceso al tablero
        Tiempo real. CONTADOR sólo E11. Scope canónico Cartera; sin FIFO local.
        Periodo inclusive America/Mexico_City, máximo 366 días. Puente separa
        recepción física, registro histórico no atestado, corrección, devolución
        y aplicaciones. cobranzaTotal y recepcionesFisicas son null en SITIOS: allí no se llama
        recepción al reparto a notas. Aplicaciones nunca se suman a ingreso.
        Stock retenido y antigüedad son actuales al generadoEn, no sólo recepciones
        dentro del periodo. No son favor ni reducen deuda. Sin sitio sólo global.
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date } }
        - { name: ubicacionId, in: query, schema: { type: string, pattern: '^[1-9]\d*$' } }
        - { name: ubicacionIds, in: query, schema: { type: string, pattern: '^[1-9]\d*(,[1-9]\d*)*$' } }
      responses:
        "200":
          description: Puente saneado, no suma aplicación como segundo ingreso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E7Atribucion" }
        default: { $ref: "#/components/responses/E7ErrorResponse" }
  /e7/atribucion.xlsx:
    get:
      operationId: exportE7AtribucionXlsx
      tags: [e7]
      description: Mismo lector, autorización, puente, detalle y leyendas que getE7Atribucion. No exporta una fuente legacy alternativa.
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date } }
        - { name: ubicacionId, in: query, schema: { type: string, pattern: '^[1-9]\d*$' } }
        - { name: ubicacionIds, in: query, schema: { type: string, pattern: '^[1-9]\d*(,[1-9]\d*)*$' } }
      responses:
        "200":
          description: XLSX de atribución con cifras exactas y leyendas internas
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/E7ErrorResponse" }
  /e7/atribucion.pdf:
    get:
      operationId: exportE7AtribucionPdf
      tags: [e7]
      description: Mismo lector y contenido monetario que getE7Atribucion; conserva las leyendas dentro del archivo.
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date } }
        - { name: ubicacionId, in: query, schema: { type: string, pattern: '^[1-9]\d*$' } }
        - { name: ubicacionIds, in: query, schema: { type: string, pattern: '^[1-9]\d*(,[1-9]\d*)*$' } }
      responses:
        "200":
          description: PDF de atribución y retenido separado
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/E7ErrorResponse" }
  /e7/clientes/{clienteId}/exportacion:
    get:
      operationId: getE7ClienteExportacion
      tags: [e7]
      description: >
        Proyección usada por XLSX/PDF/imprimir de Grupo 1. Requiere permiso real
        clientes_finanzas.ver; CONTADOR sólo E11. No habilita grupos 2–4.
        Resumen global contiene exactamente cuatro cifras; todo otro dato es
        del alcance. Proyección FIFO siempre completa antes de filtrar detalle,
        incluye porciones de abonos sin ticket y saldo pendiente de notas permitidas.
        Misma semántica en los tres archivos existentes cuando E7 esté habilitado.
      parameters:
        - { name: clienteId, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
        - { name: ubicacionId, in: query, schema: { type: string, pattern: '^[1-9]\d*$' } }
        - { name: ubicacionIds, in: query, schema: { type: string, pattern: '^[1-9]\d*(,[1-9]\d*)*$' } }
      responses:
        "200":
          description: Cuatro cifras globales y detalle autorizado compartido con archivos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E7ClienteExportacion" }
        default: { $ref: "#/components/responses/E7ErrorResponse" }
  /e11/operaciones/{actorId}/{accion}/{uuidOriginal}:
    parameters:
      - { name: actorId, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
      - { name: accion, in: path, required: true, schema: { $ref: "#/components/schemas/E11OperacionAccion" } }
      - { name: uuidOriginal, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getE11OperacionRecuperacion
      tags: [e11]
      summary: Consultar metadata de intención exacta, sólo ADMIN real con FISCAL_LEER
      description: >
        Gate E11_ENABLED OFF por defecto. No devuelve payload ni IDs financieros.
        PENDIENTE significa ausencia observada, NO ausencia definitiva de efectos.
        Sólo CONFIRMADA o CERRADA_SIN_EFECTO con resolucionId no null permiten liberar cuarentena de la
        terna exacta actorId/accion/uuidOriginal. Un 404 o timeout nunca la libera.
        Sesión/identidad ADMIN se revalidan antes de entregar. No otorga mutación financiera.
      responses:
        "200":
          description: Metadata saneada de la intención y revisión CAS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E11OperacionRecuperacion" }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/operaciones/{actorId}/{accion}/{uuidOriginal}/resolucion:
    parameters:
      - { name: actorId, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
      - { name: accion, in: path, required: true, schema: { $ref: "#/components/schemas/E11OperacionAccion" } }
      - { name: uuidOriginal, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resolveE11Operacion
      tags: [e11]
      summary: Resolver cuarentena sin replicar operación, sólo ADMIN real con FISCAL_LEER
      description: >
        Gate E11_ENABLED OFF. Requiere identidadVersion igual a permisosVersion
        de identidad ADMIN fresca y revisionEsperada de GET para la terna exacta.
        Si existe operación confirma metadata; si no, inserta tombstone append-only
        bajo el mismo lock/PK de todos los productores antes de cerrar sin efecto.
        Audita admin, actor original, terna, motivo, revisión e UUID resolutor.
        UUID del cuerpo es del resolutor, distinto conceptualmente del UUID original
        del path. Retry usa mismo admin/UUID/cuerpo/path y retorna resolución original.
        Nunca escribe en caja, cartera, aplicación, devolución ni propuestas E5.
        Si POST tiene outcome incierto, consultar GET de la terna original o repetir
        este POST exacto; nunca crear cuarentena recursiva de la resolución.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveE11OperacionBody" }
      responses:
        "200":
          description: Resolución terminal saneada, no efecto financiero
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E11OperacionRecuperacion" }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/disponibilidad:
    get:
      operationId: getE11Disponibilidad
      tags: [e11]
      responses:
        "200":
          description: OFF constante, sin sesión ni consultas a tablas E11 o columnas nuevas de usuarios
          content: { application/json: { schema: { $ref: "#/components/schemas/E11Disponibilidad" } } }
  /e11/identidad:
    get:
      operationId: getE11Identidad
      tags: [e11]
      responses:
        "200":
          description: Identidad autoritativa; no cambia el rol base
          content: { application/json: { schema: { $ref: "#/components/schemas/E11Identidad" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/usuarios/{usuarioId}/perfil:
    parameters:
      - { name: usuarioId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getE11Perfil
      tags: [e11]
      responses:
        "200":
          description: Solo ADMIN real; perfil efectivo y versión del usuario CONTADOR
          content: { application/json: { schema: { $ref: "#/components/schemas/E11Identidad" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
    put:
      operationId: assignE11Perfil
      tags: [e11]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/E11PerfilInput" } } }
      responses:
        "200":
          description: Asignación e historial atómicos; replay no duplica
          content: { application/json: { schema: { $ref: "#/components/schemas/E11PerfilEvento" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/usuarios/{usuarioId}/perfil/historial:
    get:
      operationId: listE11PerfilHistorial
      tags: [e11]
      parameters:
        - { name: usuarioId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/E11Cursor" }
        - { $ref: "#/components/parameters/E11Limit" }
      responses:
        "200":
          description: Solo ADMIN real, historial append-only
          content: { application/json: { schema: { $ref: "#/components/schemas/E11PerfilHistorial" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/fiscal/clientes:
    get:
      operationId: listE11FiscalClientes
      tags: [e11]
      parameters:
        - { $ref: "#/components/parameters/E11Cursor" }
        - { $ref: "#/components/parameters/E11Limit" }
      responses:
        "200":
          description: F o ADMIN; exclusivamente clientes con ventas facturadas, sin cartera ni crédito global
          content: { application/json: { schema: { $ref: "#/components/schemas/E11FiscalClientes" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/fiscal/ventas:
    get:
      operationId: listE11FiscalVentas
      tags: [e11]
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hastaExclusivo, in: query, required: true, schema: { type: string, format: date } }
        - { name: clienteId, in: query, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/E11Cursor" }
        - { $ref: "#/components/parameters/E11Limit" }
      responses:
        "200":
          description: F o ADMIN, lector fiscal global dedicado; total FACTURADO, nunca cobrado
          content: { application/json: { schema: { $ref: "#/components/schemas/E11FiscalVentas" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/fiscal/facturas/{facturaId}:
    get:
      operationId: getE11FiscalFactura
      tags: [e11]
      parameters:
        - { name: facturaId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Proyección saneada, no XML/PDF fiscal original con domicilio o identificación
          content: { application/json: { schema: { $ref: "#/components/schemas/E11FiscalVenta" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/finanzas/clientes:
    get:
      operationId: listE11FinanzasClientes
      tags: [e11]
      parameters:
        - { $ref: "#/components/parameters/E11Cursor" }
        - { $ref: "#/components/parameters/E11Limit" }
      responses:
        "200":
          description: Solo A explícito o ADMIN, consulta global limitada; no endpoints generales E7
          content: { application/json: { schema: { $ref: "#/components/schemas/E11FinanzasClientes" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/finanzas/clientes/{clienteId}/notas:
    get:
      operationId: listE11FinanzasNotas
      tags: [e11]
      parameters:
        - { name: clienteId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/E11Cursor" }
        - { $ref: "#/components/parameters/E11Limit" }
      responses:
        "200":
          description: A o ADMIN; facturadas y no facturadas, saldos canónicos sin datos de mercancía
          content: { application/json: { schema: { $ref: "#/components/schemas/E11FinanzasNotas" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/finanzas/clientes/{clienteId}/estado-cuenta:
    get:
      operationId: getE11FinanzasEstadoCuenta
      tags: [e11]
      parameters:
        - { name: clienteId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/E11Cursor" }
        - { $ref: "#/components/parameters/E11Limit" }
      responses:
        "200":
          description: A o ADMIN; proyección contable limitada, sin medios, cuentas, comprobantes o links legacy
          content: { application/json: { schema: { $ref: "#/components/schemas/E11EstadoCuenta" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/conciliaciones:
    get:
      operationId: listE11Conciliaciones
      tags: [e11]
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hastaExclusivo, in: query, required: true, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/E11Cursor" }
        - { $ref: "#/components/parameters/E11Limit" }
      responses:
        "200":
          description: F o ADMIN; incluye periodos obligatorios pendientes aunque aún no tengan snapshot
          content: { application/json: { schema: { $ref: "#/components/schemas/E11Periodos" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
    post:
      operationId: createE11Conciliacion
      tags: [e11]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/E11SnapshotInput" } } }
      responses:
        "200":
          description: F; congela conjunto completo de ventas facturadas y cifras, sin dinero
          content: { application/json: { schema: { $ref: "#/components/schemas/E11Conciliacion" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/conciliaciones/{id}:
    get:
      operationId: getE11Conciliacion
      tags: [e11]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: F o ADMIN; evidencia congelada e historial de revisiones, nunca recálculo silencioso
          content: { application/json: { schema: { $ref: "#/components/schemas/E11Conciliacion" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/conciliaciones/{id}/decisiones:
    post:
      operationId: decideE11Conciliacion
      tags: [e11]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/E11DecisionInput" } } }
      responses:
        "200":
          description: F; ACEPTADA o NO_CUADRA, aviso ADMIN atómico en discrepancia; no operación monetaria
          content: { application/json: { schema: { $ref: "#/components/schemas/E11Conciliacion" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/conciliaciones/{id}/ventas:
    get:
      operationId: listE11ConciliacionVentas
      tags: [e11]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/E11Cursor" }
        - { $ref: "#/components/parameters/E11Limit" }
      responses:
        "200":
          description: F o ADMIN; renglones congelados del snapshot, nunca ventas actuales
          content: { application/json: { schema: { $ref: "#/components/schemas/E11FiscalVentas" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/a/preparaciones:
    get:
      operationId: listE11Preparaciones
      tags: [e11]
      parameters:
        - { name: clienteId, in: query, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/E11Cursor" }
        - { $ref: "#/components/parameters/E11Limit" }
      responses:
        "200":
          description: A explícito y gates E11/E5; bandeja global de fuentes pendientes reales
          content: { application/json: { schema: { $ref: "#/components/schemas/E11Preparaciones" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e11/a/preparaciones/{cobroId}:
    get:
      operationId: getE11Preparacion
      tags: [e11]
      parameters:
        - { name: cobroId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: A explícito, E11 y E5 habilitados; fuente E5 real proyectada sin documentos sensibles
          content: { application/json: { schema: { $ref: "#/components/schemas/E11Preparacion" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
    post:
      operationId: prepareE11Aplicacion
      tags: [e11]
      parameters:
        - { name: cobroId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/E11PreparacionInput" } } }
      responses:
        "200":
          description: Adaptador del servicio real E5 de propuesta; no recepción ni aplicación paralela
          content: { application/json: { schema: { $ref: "#/components/schemas/E11Preparacion" } } }
        default: { $ref: "#/components/responses/E11ErrorResponse" }
  /e5/disponibilidad:
    get:
      operationId: getE5Disponibilidad
      tags: [e5]
      parameters:
        - { name: ubicacionId, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: OFF sin lecturas; capacidades no equivalen a habilitación
          content: { application/json: { schema: { $ref: "#/components/schemas/E5Disponibilidad" } } }
        default: { $ref: "#/components/responses/E5ErrorResponse" }
  /e5/contexto:
    get:
      operationId: getE5Contexto
      tags: [e5]
      parameters:
        - { name: clienteId, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: ubicacionId, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Notas y sesiones permitidas; contexto autoritativo, no reserva
          content: { application/json: { schema: { $ref: "#/components/schemas/E5Contexto" } } }
        default: { $ref: "#/components/responses/E5ErrorResponse" }
  /e5/cobros:
    get:
      operationId: listE5Cobros
      tags: [e5]
      parameters:
        - { name: ubicacionId, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: clienteId, in: query, schema: { type: integer, minimum: 1 } }
