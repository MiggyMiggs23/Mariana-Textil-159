      type: object
      additionalProperties: false
      required: [uuid, revisionEsperada, identidadVersion, motivo]
      properties:
        uuid: { type: string, format: uuid }
        revisionEsperada: { type: string, pattern: '^[a-f0-9]{64}$' }
        identidadVersion: { type: string, pattern: '^[a-f0-9]{64}$' }
        motivo: { type: string, minLength: 1, maxLength: 500 }
    E11OperacionRecuperacion:
      type: object
      additionalProperties: false
      required: [actorId, accion, uuidOriginal, estado, revision, resolucionId, resueltoEn]
      properties:
        actorId: { type: integer, minimum: 1, maximum: 2147483647 }
        accion: { $ref: "#/components/schemas/E11OperacionAccion" }
        uuidOriginal: { type: string, format: uuid }
        estado: { type: string, enum: [PENDIENTE, CONFIRMADA, CERRADA_SIN_EFECTO] }
        revision: { type: string, pattern: '^[a-f0-9]{64}$' }
        resolucionId: { type: [string, "null"], format: uuid }
        resueltoEn: { type: [string, "null"], format: date-time }
    E11Error:
      oneOf:
        - $ref: "#/components/schemas/E11OrdinaryError"
        - $ref: "#/components/schemas/E11OutcomeError"
    E11OrdinaryError:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [VALIDACION, NO_AUTENTICADO, E11_DISABLED, PERFIL_DENEGADO, PERMISO_DENEGADO, ADMIN_REQUERIDO, E5_DISABLED, NO_ENCONTRADO, UUID_REUTILIZADO, REVISION_OBSOLETA, PERFIL_CAMBIADO, FUENTE_CAMBIADA, PERIODO_ABIERTO, ESTADO_INVALIDO, NOTA_SIN_SALDO, IMPORTE_NO_COINCIDE, USUARIO_NO_CONTADOR, DEPENDENCIA_NO_DISPONIBLE, OPERACION_CERRADA_SIN_EFECTO]
        message: { type: string }
        requestId: { type: string, format: uuid }
    E11OutcomeError:
      type: object
      additionalProperties: false
      description: No demuestra ausencia de efectos; conservar UUID e intención sin exponer el resultado privado.
      required: [code, message, requestId, uuid]
      properties:
        code:
          type: string
          enum: [RESULTADO_CONFIRMADO_NO_CONSULTABLE, RESULTADO_INCIERTO]
        message: { type: string }
        requestId: { type: string, format: uuid }
        uuid: { type: string, format: uuid }
    E5Money:
      type: string
      pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'
      maxLength: 13
    E5Estado:
      type: string
      enum: [PENDIENTE, PARCIAL, APLICADO, DEVUELTO]
    E5Actor:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer }
        nombre: { type: string }
