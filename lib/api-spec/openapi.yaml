        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: naturaleza, in: query, schema: { $ref: "#/components/schemas/FondoNaturaleza" } }
        - { name: categoria, in: query, schema: { $ref: "#/components/schemas/FondoCategoria" } }
      responses:
        "200":
          description: Libro completo y saldo en una misma instantánea
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FondoMovimientosResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createFondoMovimiento
      tags: [fondo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FondoMovimientoInput" }
      responses:
        "201":
          description: Movimiento creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FondoMovimiento" }
        "200":
          description: Repetición idempotente
          headers:
            Idempotent-Replay: { schema: { type: string, const: "true" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FondoMovimiento" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /fondo/movimientos/{id}:
    get:
      operationId: getFondoMovimiento
      tags: [fondo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' } }
      responses:
        "200":
          description: Detalle enlazado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FondoMovimiento" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /fondo/movimientos/{id}/inverso:
    post:
      operationId: reverseFondoMovimiento
      tags: [fondo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FondoInversoInput" }
      responses:
        "201":
          description: Inverso contable creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FondoMovimiento" }
        "200":
          description: Repetición idempotente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FondoMovimiento" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /fondo/arqueos:
    get:
      operationId: listFondoArqueos
