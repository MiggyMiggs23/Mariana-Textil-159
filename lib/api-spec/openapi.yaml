          schema: { type: number }
        - in: query
          name: productoId
          schema: { type: number }
        - in: query
          name: consolidado
          schema: { type: boolean }
          description: Solo ADMIN; agrega todas las ubicaciones
      responses:
        "200":
          description: Existencias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExistenciaRow"
  /inventario/ubicaciones:
    get:
      operationId: getUbicacionesInventario
      tags: [inventario]
      summary: Ubicaciones operativas activas para seleccionar alcance de inventario
      description: Requiere inventario/ver. No concede acceso al módulo administrativo de ubicaciones.
      responses:
        "200":
          description: Ubicaciones activas sin campos sensibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UbicacionInventario"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inventario/existencias/agrupadas:
    get:
      operationId: getExistenciasAgrupadas
      tags: [inventario]
      summary: Existencias actuales agrupadas por tela y color, sin series ni costos
      parameters:
        - in: query
          name: ubicacionId
          schema: { type: number }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: includeSinExistencia
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Existencias agrupadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExistenciaAgrupada"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inventario/kardex:
    get:
      operationId: getKardex
      tags: [inventario]
      summary: Historial completo de movimientos, filtrable y paginado
      parameters:
        - in: query
          name: modo
          description: Preset de solo lectura. TODO_LO_QUE_SALIO fuerza VENTA, TRANSFERENCIA_SALIDA y SALIDA_MOSTRADOR, aun si tipos contiene otros valores.
          schema:
            type: string
            enum: [TODO_LO_QUE_SALIO]
        - in: query
          name: tipos
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TipoMovimiento"
        - in: query
          name: productoId
          schema: { type: number }
        - in: query
          name: ubicacionId
          schema: { type: number }
        - in: query
          name: usuarioId
          schema: { type: number }
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
        - in: query
          name: buscar
          schema: { type: string }
        - in: query
          name: incluirUbicacionesInactivas
          schema: { type: boolean, default: false }
        - in: query
          name: page
          schema: { type: number, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: number, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Movimientos del kardex
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KardexResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inventario/kardex/filtros:
    get:
      operationId: listKardexFilters
      tags: [inventario]
      summary: Metadatos de filtros disponibles para el historial
      parameters:
        - in: query
          name: incluirUbicacionesInactivas
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Productos, usuarios, ubicaciones y tipos con movimientos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KardexFilters"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inventario/kardex/exportar:
    get:
      operationId: exportKardexXlsx
