        "200":
          description: Historial completo de conteos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FondoArqueosResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createFondoArqueo
      tags: [fondo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FondoArqueoInput" }
      responses:
        "201":
          description: Conteo persistido sin ajuste monetario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FondoArqueo" }
        "200":
          description: Repetición idempotente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FondoArqueo" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /fondo/arqueos/{id}:
    get:
      operationId: getFondoArqueo
      tags: [fondo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' } }
      responses:
        "200":
          description: Conteo y valores de referencia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FondoArqueo" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /fondo/exportar:
    get:
      operationId: exportFondoCsv
      tags: [fondo]
      parameters:
        - name: tipo
          in: query
          required: true
          schema: { type: string, enum: [movimientos, arqueos] }
      responses:
        "200":
          description: CSV completo, sólo ADMIN
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  parameters:
    E11Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2048 }
      description: Opaco, ligado a actor/perfilVersion/filtros/snapshot; no acepta cursor de otro alcance
    E11Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PurgaEntidad:
      name: entidad
      in: path
      required: true
      schema:
        type: string
        enum: [usuarios, camionetas, choferes, clientes, proveedores, productos]
    PurgaId:
      name: id
      in: path
      required: true
      schema: { type: number, minimum: 1 }
    CamionetaId:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: number, minimum: 1 },
      }
    ChoferId:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: number, minimum: 1 },
      }
    ReportePeriodo:
      name: periodo
      in: query
      schema:
        {
          type: string,
          enum:
            [
              diario,
              semanal,
              mensual,
              trimestral,
              semestral,
              anual,
              personalizado,
            ],
          default: mensual,
        }
    ReporteUbicacionIds:
      { name: ubicacionIds, in: query, schema: { type: string } }
    ReporteProductoIds:
      { name: productoIds, in: query, schema: { type: string } }
    ReporteTelas: { name: telas, in: query, schema: { type: string } }
    ReporteColores: { name: colores, in: query, schema: { type: string } }
    ReporteUnidades: { name: unidades, in: query, schema: { type: string } }
    ReporteUsuarioIds: { name: usuarioIds, in: query, schema: { type: string } }
    ReporteClienteIds: { name: clienteIds, in: query, schema: { type: string } }
    ReporteProveedorIds:
      { name: proveedorIds, in: query, schema: { type: string } }
    ReporteFormasPago: { name: formasPago, in: query, schema: { type: string } }
    ReporteFacturado: { name: facturado, in: query, schema: { type: boolean } }
    ReporteModalidad:
      name: modalidad
      in: query
      description: Modalidad de las líneas de venta; Todo no restringe resultados.
      schema: { type: string, enum: [TODO, ROLLOS, METRAJE], default: TODO }
    ReporteMargenUmbral:
      { name: margenUmbral, in: query, schema: { type: number, default: 15 } }
    ReporteCoberturaCritico:
      {
        name: coberturaCritico,
        in: query,
        schema: { type: number, default: 7 },
      }
    ReporteCoberturaBajo:
      { name: coberturaBajo, in: query, schema: { type: number, default: 15 } }
    ReporteCoberturaNormal:
      {
        name: coberturaNormal,
        in: query,
        schema: { type: number, default: 60 },
      }
    ReporteCoberturaExceso:
      {
        name: coberturaExceso,
        in: query,
        schema: { type: number, default: 90 },
      }
    AnalyticsDesde:
      name: desde
      in: query
      schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      description: Día inicial en America/Mexico_City
    AnalyticsHasta:
      name: hasta
      in: query
      schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      description: Día final en America/Mexico_City
    AnalyticsUbicacionId:
      name: ubicacionId
      in: query
      schema: { type: number }
    AccountDestination:
      name: cuentaDestino
      in: path
      required: true
      schema:
        type: string
        enum: [CAJA_FISICA, CUENTA_NO_FISCAL, CUENTA_FISCAL, CUENTAS_POR_COBRAR]
    LocationId:
      name: id
      in: path
      required: true
      schema:
        type: number
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ProductoId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ProveedorId:
      name: id
      in: path
      required: true
      schema:
        type: number
    RolloId:
      name: id
      in: path
      required: true
      schema:
        type: number
    MovimientoId:
      name: id
      in: path
      required: true
      schema:
        type: number
    EntradaId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ContenedorId:
      name: id
      in: path
      required: true
      schema:
        type: number
    SalidaId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ClienteId:
      name: id
      in: path
      required: true
      schema:
        type: number
    TicketId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ClienteTicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: number
    ClientePagoId:
      name: pagoId
      in: path
      required: true
      schema:
        type: number
    SesionCajaId:
      name: id
      in: path
      required: true
      schema:
        type: number
    NotificacionId:
      name: id
      in: path
      required: true
      schema:
        type: number
  responses:
    E7ErrorResponse:
      description: Error explícito; jamás fallback a lectura legacy global
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                type: string
                enum: [E7_DISABLED, E7_DEPENDENCIA_NO_DISPONIBLE, E7_FUENTE_INVALIDA, NO_AUTENTICADO, PERFIL_DENEGADO, PERMISO_DENEGADO, PERFIL_CAMBIADO, VALIDACION, ALCANCE_DENEGADO, NO_ENCONTRADO]
              message: { type: string }
    E5ErrorResponse:
      description: Error E5 explícito; no inferir éxito ni dinero cero
      content: { application/json: { schema: { $ref: "#/components/schemas/E5Error" } } }
    E11ErrorResponse:
      description: 400 VALIDACION; 401 NO_AUTENTICADO; 403 E11_DISABLED/PERFIL_DENEGADO/PERMISO_DENEGADO/ADMIN_REQUERIDO/E5_DISABLED; 404 NO_ENCONTRADO; 409 UUID_REUTILIZADO/REVISION_OBSOLETA/PERFIL_CAMBIADO/FUENTE_CAMBIADA/PERIODO_ABIERTO/ESTADO_INVALIDO/NOTA_SIN_SALDO; 422 IMPORTE_NO_COINCIDE/USUARIO_NO_CONTADOR; 503 DEPENDENCIA_NO_DISPONIBLE. Sin fallback legacy.
      content: { application/json: { schema: { $ref: "#/components/schemas/E11Error" } } }
    E9ErrorResponse:
      description: Error E9 explícito; sin efecto financiero parcial
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/E9Error"
    SalidaDetailResponse:
      description: Estado actualizado de la salida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SalidaDetail"
    Unauthorized:
      description: Sesión no válida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sin permisos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Demasiados intentos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    RolloRemateInput:
      type: object
      additionalProperties: false
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 1 }
    RolloRemate:
      type: object
      required: [rolloId, remate]
      properties:
        rolloId: { type: integer }
        remate: { type: boolean }
    E7Importe:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}$'
    E7Retenido:
      type: object
      additionalProperties: false
      required: [cobroId, fechaRecepcion, ubicacionId, importePendiente, antiguedadDias]
      properties:
        cobroId: { type: string, format: uuid }
        fechaRecepcion: { type: string, format: date-time }
        ubicacionId: { type: integer }
        importePendiente: { $ref: "#/components/schemas/E7Importe" }
        antiguedadDias: { type: integer, minimum: 0 }
    E7Movimiento:
      type: object
      additionalProperties: false
      required: [id, fecha, tipo, importe, ubicacionId, cuentaDestino]
      properties:
        id: { type: string }
        fecha: { type: string, format: date-time }
        tipo: { type: string }
        importe: { $ref: "#/components/schemas/E7Importe" }
        ubicacionId: { type: [integer, "null"] }
        cuentaDestino: { type: [string, "null"] }
        folio: { type: [string, "null"] }
        saldoPendiente: { type: [string, "null"], pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}$' }
    E7ClienteExportacion:
      type: object
      additionalProperties: false
      required: [clienteId, alcance, generadoEn, leyendas, resumenGlobal, movimientos, retenidos, totalRetenido]
      properties:
        clienteId: { type: integer }
        alcance: { $ref: "#/components/schemas/CarteraAlcance" }
        generadoEn: { type: string, format: date-time }
        leyendas: { type: array, items: { type: string } }
        resumenGlobal:
          type: object
          additionalProperties: false
          required: [deudaActual, saldoAFavor, limiteCredito, creditoDisponible]
          properties:
            deudaActual: { $ref: "#/components/schemas/E7Importe" }
            saldoAFavor: { $ref: "#/components/schemas/E7Importe" }
            limiteCredito: { $ref: "#/components/schemas/E7Importe" }
            creditoDisponible: { $ref: "#/components/schemas/E7Importe" }
        movimientos: { type: array, items: { $ref: "#/components/schemas/E7Movimiento" } }
        retenidos: { type: array, items: { $ref: "#/components/schemas/E7Retenido" } }
        totalRetenido: { $ref: "#/components/schemas/E7Importe" }
    E7Atribucion:
      type: object
      additionalProperties: false
      required: [alcance, generadoEn, leyendas, cobranzaTotal, recepcionesFisicas, aplicacionesNotas, movimientos, puente, retenidos, totalRetenido]
      properties:
        alcance: { $ref: "#/components/schemas/CarteraAlcance" }
        generadoEn: { type: string, format: date-time }
        leyendas: { type: array, items: { type: string } }
        cobranzaTotal:
          type: [string, "null"]
          description: Global, incluye puente histórico/correcciones sin atestarlos como dinero físico nuevo; null en SITIOS.
        recepcionesFisicas:
          type: [string, "null"]
          description: Sólo POS y recepción explícitamente física, sin históricos indeterminados ni correcciones; null en SITIOS.
        aplicacionesNotas: { $ref: "#/components/schemas/E7Importe" }
        movimientos: { type: array, items: { $ref: "#/components/schemas/E7Movimiento" } }
        puente:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tipo, cuentaDestino, ubicacionId, total]
            properties:
              tipo: { type: string }
              cuentaDestino: { type: [string, "null"] }
              ubicacionId: { type: [integer, "null"] }
              total: { $ref: "#/components/schemas/E7Importe" }
        retenidos: { type: array, items: { $ref: "#/components/schemas/E7Retenido" } }
        totalRetenido: { $ref: "#/components/schemas/E7Importe" }
    E11Disponibilidad:
      type: object
      additionalProperties: false
      required: [enabled, perfiles, conciliacion, preparacionE5]
      properties:
        enabled: { type: boolean }
        perfiles: { type: boolean }
        conciliacion: { type: boolean }
        preparacionE5: { type: boolean }
    E11Identidad:
      type: object
      additionalProperties: false
      required: [usuarioId, rolBase, perfil, perfilVersion, permisosVersion, capacidades]
      properties:
        usuarioId: { type: integer }
