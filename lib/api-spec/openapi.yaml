      properties:
        clienteId: { type: integer }
        clienteNombre: { type: string }
        ubicacionId: { type: integer }
        versionContexto: { type: string, description: Token opaco servidor del contexto canónico de saldos autorizado; nunca derivar en UI }
        consultadoAt: { type: string, format: date-time }
        notas: { type: array, items: { $ref: "#/components/schemas/E5Nota" } }
        sesiones: { type: array, items: { $ref: "#/components/schemas/E5Sesion" } }
        capacidades: { $ref: "#/components/schemas/E5Capacidades" }
    E5RecepcionInput:
      type: object
      additionalProperties: false
      required: [claveOperacion, clienteId, ubicacionId, versionContexto, entrada, importe, formaPago, cuentaDestino, notasIndicadas, evidencia]
      properties:
        claveOperacion: { type: string, format: uuid }
        clienteId: { type: integer, minimum: 1 }
        ubicacionId: { type: integer, minimum: 1 }
        versionContexto: { type: string, minLength: 1, maxLength: 200 }
        entrada: { type: string, enum: [CAJA, CLIENTE] }
        importe: { $ref: "#/components/schemas/E5Money" }
