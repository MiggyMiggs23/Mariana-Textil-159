      properties:
        ticketId: { type: number }
        clienteNombre: { type: string }
        saldoActual: { type: string }
        importe: { type: string }
        suma: { type: string }
        limiteCredito: { type: string }
        creditoDisponibleResultante: { type: string }
        exceso: { type: string }
        autorizable: { type: boolean }
    TicketDetalle:
      allOf:
        - $ref: "#/components/schemas/TicketResumen"
        - $ref: "#/components/schemas/TicketCredito"
        - type: object
          required: [lineas, documentoTipo, convertidoANotaPorCobro]
          properties:
            documentoTipo:
              $ref: "#/components/schemas/DocumentoTipoTicket"
            nombreDestinatario: { type: ["string", "null"] }
            direccionEntregaSnapshot: { type: ["string", "null"] }
            convertidoANotaPorCobro:
              type: boolean
              description: Indica que esta operación de cobro convirtió el comprobante de TICKET a NOTA por incluir crédito.
            diasCreditoCliente:
              type: ["number", "null"]
              enum: [7, 15, 30, 60]
              description: Plazo habitual permitido del cliente; null cuando no está configurado.
            viaje: { $ref: "#/components/schemas/ViajeTicketLink" }
            salidas:
              type: array
              description: Salidas para venta que originaron este documento.
              items: { $ref: "#/components/schemas/SalidaVentaLink" }
            lineas:
              type: array
              items:
                $ref: "#/components/schemas/TicketLinea"
            pagos:
              type: array
              items:
                $ref: "#/components/schemas/TicketPago"
    TicketDocumentoImpresion:
      oneOf:
        - $ref: "#/components/schemas/TicketDocumentoImpresionConPrecios"
        - $ref: "#/components/schemas/TicketDocumentoImpresionSinPrecios"
    TicketDocumentoImpresionBase:
      type: object
      required:
        [
          ticketId,
          folio,
          copia,
          documentoTipo,
          notaSinPrecios,
          ubicacionId,
          nombreUbicacion,
          createdAt,
          estado,
          clienteId,
          nombreCliente,
          nombreDestinatario,
          direccionEntregaSnapshot,
          direccionEntregaEfectiva,
          telefonoCliente,
          correoCliente,
          direccionFiscalEfectiva,
          facturado,
          esCredito,
          diasPlazo,
          fechaVencimiento,
          lineas,
        ]
      properties:
        ticketId: { type: number }
        folio: { type: number }
