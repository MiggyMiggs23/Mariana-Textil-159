  /etiquetas/reimpresiones:
    post:
      operationId: crearReimpresionEtiquetas
      tags: [etiquetas]
      summary: Registra y devuelve de una a 50 etiquetas para imprimir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rolloIds, motivo]
              properties:
                rolloIds:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 50,
                    uniqueItems: true,
                    items: { type: number },
                  }
                motivo: { type: string, minLength: 10, maxLength: 1000 }
                adminUsuario: { type: string }
                adminPassword:
                  { type: string, format: password, writeOnly: true }
      responses:
        "201":
          description: Etiquetas registradas
          content:
            application/json:
              schema:
                type: object
                required: [etiquetas, registradoAt]
                properties:
                  etiquetas:
                    {
                      type: array,
                      items:
                        { $ref: "#/components/schemas/EtiquetaImprimible" },
                    }
                  registradoAt: { type: string, format: date-time }
        "400":
          description: Solicitud inválida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
