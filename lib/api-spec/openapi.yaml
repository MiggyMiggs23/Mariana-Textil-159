          type: ["string", "null"]
          pattern: "^#[0-9A-F]{6}$"
          description: Color hexadecimal capturado manualmente; no se deriva del nombre del color
        anchoCm:
          type: ["number", "null"]
          multipleOf: 0.01
          description: Ancho capturado manualmente en centímetros; los productos históricos permanecen null.
        composicion:
          type: ["string", "null"]
          description: Composición textil libre capturada manualmente; no se infiere.
        gramajeGm2:
          type: ["number", "null"]
          multipleOf: 0.01
          description: Gramaje capturado manualmente en g/m²; los productos históricos permanecen null.
