  /admin/cuentas-destino:
    get:
      operationId: getAdminCuentasDestino
      tags: [admin-analytics]
      summary: Resumen y tendencias de cuentas destino derivadas de pagos y facturación
      parameters:
        - $ref: "#/components/parameters/AnalyticsDesde"
        - $ref: "#/components/parameters/AnalyticsHasta"
        - $ref: "#/components/parameters/AnalyticsUbicacionId"
        - {
            in: query,
            name: compare,
            description: Ejecuta la comparación contra un periodo anterior de igual duración. Cuando es false no se consulta el periodo anterior.,
            schema: { type: boolean, default: false },
          }
        - {
            in: query,
            name: preset,
            description: Identifica el periodo de calendario para comparar tramos en curso equivalentes.,
            schema: { type: string, enum: [hoy, semana, mes, trimestre, semestre, ano, custom] },
          }
      responses:
        "200":
          description: Cuentas destino
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCuentasDestino" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/cuentas-destino/{cuentaDestino}/movimientos:
    get:
      operationId: listAdminCuentaDestinoMovimientos
      tags: [admin-analytics]
      summary: Lista los movimientos reales de una cuenta destino
      parameters:
        - {
            in: path,
            name: cuentaDestino,
            required: true,
            schema: { type: string, enum: [TODAS, CAJA_FISICA, CUENTA_NO_FISCAL, CUENTA_FISCAL, CUENTAS_POR_COBRAR] },
          }
        - $ref: "#/components/parameters/AnalyticsDesde"
        - $ref: "#/components/parameters/AnalyticsHasta"
        - $ref: "#/components/parameters/AnalyticsUbicacionId"
        - { in: query, name: facturado, schema: { type: boolean } }
        - {
            in: query,
            name: formaPago,
            description: Categoría reconciliada de la matriz; TRANSFERENCIA incluye la forma histórica FACTURADO.,
            schema: { type: string, enum: [EFECTIVO, TRANSFERENCIA, POR_COBRAR, OTRAS] },
          }
        - {
            in: query,
            name: incongruente,
            description: Limita el detalle a abonos cuyo destino contradice la facturación de la venta.,
            schema: { type: boolean },
          }
        - {
            in: query,
            name: fuente,
            description: Filtra el mismo detalle canónico que alimenta los agregados.,
            schema: { type: array, uniqueItems: true, items: { type: string, enum: [POS, CREDITO, ABONO, ABONO_SALDO_FAVOR] } },
          }
        - {
            in: query,
            name: preset,
            description: Identifica el periodo de calendario para comparar el mismo tramo transcurrido.,
            schema: { type: string, enum: [hoy, semana, mes, trimestre, semestre, ano, custom] },
          }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Movimientos de la cuenta destino
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCuentaDestinoMovimientos" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/cuadre-fiscal:
