      summary: Resuelve una diferencia fiscal (ADMIN)
      parameters: [{ in: path, name: id, required: true, schema: { type: number, minimum: 1 } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CuadreFiscalResolucionInput" } } }
      responses:
        "200": { description: Diferencia resuelta, content: { application/json: { schema: { $ref: "#/components/schemas/CuadreFiscalRegistro" } } } }
