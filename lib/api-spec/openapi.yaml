        claveOperacion: { type: string, format: uuid }
        revisionEsperada: { type: integer, minimum: 1 }
        versionContexto: { type: string, minLength: 1, maxLength: 200 }
        propuestaId: { type: string, format: uuid }
        asignaciones: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/E5Asignacion" } }
        importeFavorAutorizado: { $ref: "#/components/schemas/E5Money", description: Solo ADMIN dentro del favor propuesto; requiere deuda global cero después de las asignaciones explícitas }
        evidencia: { $ref: "#/components/schemas/E5Evidencia" }
    E5RechazarInput:
