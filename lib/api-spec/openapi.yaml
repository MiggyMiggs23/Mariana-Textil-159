openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API para el sistema interno de Mariana Textil.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Sesión y acceso
  - name: dashboard
    description: Datos del tablero inicial
  - name: locations
    description: Administración de ubicaciones
  - name: users
    description: Administración de usuarios
  - name: productos
    description: Catálogo de productos/telas
  - name: proveedores
    description: Administración de proveedores
  - name: inventario
    description: Inventario de rollos, kardex, ajustes y conciliación
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Inicia sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Cierra la sesión actual
      responses:
        "204":
          description: Sesión cerrada
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Obtiene la sesión actual
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Obtiene conteos e inventario inicial por ubicación
      parameters:
        - in: query
          name: ubicacionId
          required: false
          schema:
            type: number
          description: Filtro opcional disponible únicamente para ADMIN
      responses:
        "200":
          description: Resumen del tablero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: Lista ubicaciones reales para administración
      responses:
        "200":
          description: Lista de ubicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Edita el nombre o estado de una ubicación
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Ubicación actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Lista usuarios
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [users]
      summary: Crea un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Edita datos, estado, ubicación o contraseña de un usuario
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /productos:
    get:
      operationId: listProductos
      tags: [productos]
      summary: Lista productos del catálogo
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProducto
      tags: [productos]
      summary: Crea un producto en el catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoInput"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /productos/{id}:
    get:
      operationId: getProducto
      tags: [productos]
      summary: Obtiene el detalle de un producto
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      responses:
        "200":
          description: Detalle del producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProducto
      tags: [productos]
      summary: Actualiza un producto del catálogo
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoUpdate"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /productos/import/preview:
    post:
      operationId: previewImportProductos
      tags: [productos]
      summary: Vista previa de importación de catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportFileInput"
      responses:
        "200":
          description: Filas con estado NUEVO, DUPLICADO o ERROR
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportPreviewRow"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /productos/import/confirm:
    post:
      operationId: confirmImportProductos
      tags: [productos]
      summary: Confirma importación de filas del catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportConfirmInput"
      responses:
        "200":
          description: Resultado de la importación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /proveedores/resumen:
    get:
      operationId: getProveedoresResumen
      tags: [proveedores]
      summary: Resumen agregado de todos los proveedores con saldos
      responses:
        "200":
          description: Resumen general de proveedores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedoresResumen"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /proveedores:
    get:
      operationId: listProveedores
      tags: [proveedores]
      summary: Lista proveedores con métricas de compras
      responses:
        "200":
          description: Objeto con resumen y lista de proveedores con métricas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedoresListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createProveedor
      tags: [proveedores]
      summary: Crea un proveedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProveedorInput"
      responses:
        "201":
          description: Proveedor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /proveedores/{id}:
    get:
      operationId: getProveedor
      tags: [proveedores]
      summary: Obtiene el detalle de un proveedor
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
      responses:
        "200":
          description: Detalle del proveedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProveedor
      tags: [proveedores]
      summary: Actualiza un proveedor
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProveedorUpdate"
      responses:
        "200":
          description: Proveedor actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/compras:
    get:
      operationId: listComprasProveedor
      tags: [proveedores]
      summary: Lista compras de un proveedor con estado Pagada/Parcial/Pendiente
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: query
          name: desde
          schema: { type: string, format: date }
          description: Fecha inicio (inclusive), formato YYYY-MM-DD
        - in: query
          name: hasta
          schema: { type: string, format: date }
          description: Fecha fin (inclusive), formato YYYY-MM-DD
        - in: query
          name: estado
          schema:
            type: string
            enum: [Pagada, Parcial, Pendiente]
          description: Filtrar por estado de pago
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        "200":
          description: Lista paginada de compras del proveedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedorComprasResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/estado-cuenta:
    get:
      operationId: estadoCuentaProveedor
      tags: [proveedores]
      summary: Estado de cuenta cronológico con saldo corrido del proveedor
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: query
          name: desde
          schema: { type: string, format: date }
          description: Fecha inicio (inclusive), formato YYYY-MM-DD
        - in: query
          name: hasta
          schema: { type: string, format: date }
          description: Fecha fin (inclusive), formato YYYY-MM-DD
      responses:
        "200":
          description: Estado de cuenta con saldo corrido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedorEstadoCuenta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/pagos:
    post:
      operationId: registrarPagoProveedor
      tags: [proveedores]
      summary: Registra un pago a proveedor (ADMIN)
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagoProveedorInput"
      responses:
        "201":
          description: Pago registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoProveedorRow"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/ajustes:
    post:
      operationId: registrarAjusteProveedor
      tags: [proveedores]
      summary: Registra un ajuste de saldo para un proveedor (ADMIN)
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AjusteProveedorInput"
      responses:
        "201":
          description: Ajuste registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoProveedorRow"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/estadisticas:
    get:
      operationId: estadisticasProveedor
      tags: [proveedores]
      summary: Estadísticas por periodo (desde y hasta requeridos)
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: query
          name: desde
          required: true
          schema: { type: string, format: date }
          description: Fecha inicio del periodo, formato YYYY-MM-DD
        - in: query
          name: hasta
          required: true
          schema: { type: string, format: date }
          description: Fecha fin del periodo, formato YYYY-MM-DD
      responses:
        "200":
          description: Estadísticas del periodo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedorEstadisticas"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/exportar:
    get:
      operationId: exportarProveedorXlsx
      tags: [proveedores]
      summary: Exporta estado de cuenta del proveedor en XLSX
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: query
          name: desde
          schema: { type: string, format: date }
          description: Fecha inicio, formato YYYY-MM-DD
        - in: query
          name: hasta
          schema: { type: string, format: date }
          description: Fecha fin, formato YYYY-MM-DD
      responses:
        "200":
          description: Archivo XLSX del estado de cuenta
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/entradas:
    post:
      operationId: crearEntrada
      tags: [inventario]
      summary: Crea una entrada completa (rollos DISPONIBLES) en una sola transacción
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntradaInput"
      responses:
        "201":
          description: Entrada creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntradaDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: listEntradas
      tags: [inventario]
      summary: Lista entradas con filtros para búsqueda y reimpresión
      parameters:
        - in: query
          name: folio
          schema: { type: number }
        - in: query
          name: proveedorId
          schema: { type: number }
        - in: query
          name: ubicacionId
          schema: { type: number }
        - in: query
          name: fechaDesde
          schema: { type: string, format: date }
        - in: query
          name: fechaHasta
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: pageSize
          schema: { type: number }
      responses:
        "200":
          description: Lista paginada de entradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntradaListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inventario/entradas/{id}:
    get:
      operationId: getEntrada
      tags: [inventario]
      summary: Obtiene el detalle completo de una entrada
      parameters:
        - $ref: "#/components/parameters/EntradaId"
      responses:
        "200":
          description: Detalle de la entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntradaDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/rollos/{id}/activar:
    post:
      operationId: activarRollo
      tags: [inventario]
      summary: Activa un rollo PROGRAMADO (PROGRAMADO → DISPONIBLE), registra RECEPCION
      parameters:
        - $ref: "#/components/parameters/RolloId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivarRolloInput"
      responses:
        "200":
          description: Rollo activado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/rollos/{id}/mover:
    post:
      operationId: moverRollo
      tags: [inventario]
      summary: Inicia traslado DISPONIBLE → EN_TRANSITO (fase 1)
      parameters:
        - $ref: "#/components/parameters/RolloId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoverRolloInput"
      responses:
        "200":
          description: Rollo en tránsito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/rollos/{id}/recibir:
    post:
      operationId: recibirTransferencia
      tags: [inventario]
      summary: Recibe rollo en destino EN_TRANSITO → DISPONIBLE (fase 2)
      parameters:
        - $ref: "#/components/parameters/RolloId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecibirTransferenciaInput"
      responses:
        "200":
          description: Rollo recibido en destino
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/rollos/{id}/salida-mostrador:
    post:
      operationId: salidaMostrador
      tags: [inventario]
      summary: Salida de mostrador DISPONIBLE → ABIERTO (terminal, SALIDA_MOSTRADOR)
      parameters:
        - $ref: "#/components/parameters/RolloId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalidaMostradorInput"
      responses:
        "200":
          description: Rollo abierto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/rollos/{id}/vender:
    post:
      operationId: venderRollo
      tags: [inventario]
      summary: Venta directa DISPONIBLE → VENDIDO (VENTA negativo)
      parameters:
        - $ref: "#/components/parameters/RolloId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenderRolloInput"
      responses:
        "200":
          description: Rollo vendido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/rollos/{id}/ajustar:
    post:
      operationId: ajustarRollo
      tags: [inventario]
      summary: Ajuste de cantidad o BAJA, justificación ≥10 caracteres, revisado=false
      parameters:
        - $ref: "#/components/parameters/RolloId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AjusteRolloInput"
      responses:
        "200":
          description: Ajuste aplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/rollos/{id}/revertir:
    post:
      operationId: revertirMovimiento
      tags: [inventario]
      summary: Revierte un movimiento del rollo (crea CANCELACION, nada se borra)
      parameters:
        - $ref: "#/components/parameters/RolloId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertirMovimientoInput"
      responses:
        "200":
          description: Movimiento revertido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/rollos/{id}:
    get:
      operationId: getRollo
      tags: [inventario]
      summary: Obtiene el detalle de un rollo con su historial completo
      parameters:
        - $ref: "#/components/parameters/RolloId"
      responses:
        "200":
          description: Detalle del rollo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/rollos:
    get:
      operationId: listRollos
      tags: [inventario]
      summary: Lista rollos con filtros opcionales
      parameters:
        - in: query
          name: ubicacionId
          schema: { type: number }
        - in: query
          name: productoId
          schema: { type: number }
        - in: query
          name: estado
          schema:
            type: string
            enum: [PROGRAMADO, DISPONIBLE, EN_TRANSITO, ABIERTO, VENDIDO, BAJA]
        - in: query
          name: serie
          schema: { type: string }
        - in: query
          name: soloAbiertos
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: pageSize
          schema: { type: number }
      responses:
        "200":
          description: Lista paginada de rollos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inventario/existencias:
    get:
      operationId: getExistencias
      tags: [inventario]
      summary: Existencias por ubicación (con scope de rol)
      parameters:
        - in: query
          name: ubicacionId
          schema: { type: number }
        - in: query
          name: productoId
          schema: { type: number }
        - in: query
          name: consolidado
          schema: { type: boolean }
          description: Solo ADMIN; agrega todas las ubicaciones
      responses:
        "200":
          description: Existencias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExistenciaRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inventario/kardex:
    get:
      operationId: getKardex
      tags: [inventario]
      summary: Kardex de un producto, filtrable y paginado (100 filas default)
      parameters:
        - in: query
          name: productoId
          required: true
          schema: { type: number }
        - in: query
          name: ubicacionId
          schema: { type: number }
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: pageSize
          schema: { type: number }
      responses:
        "200":
          description: Movimientos del kardex
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KardexResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/ajustes/pendientes:
    get:
      operationId: listAjustesPendientes
      tags: [inventario]
      summary: Lista de ajustes pendientes de revisión (revisado=false, ADMIN)
      responses:
        "200":
          description: Ajustes pendientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovimientoRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inventario/ajustes/{id}/revisar:
    post:
      operationId: revisarAjuste
      tags: [inventario]
      summary: Marca un ajuste como revisado (ADMIN)
      parameters:
        - $ref: "#/components/parameters/MovimientoId"
      responses:
        "200":
          description: Ajuste revisado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovimientoRow"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/conciliacion:
    get:
      operationId: getConciliacion
      tags: [inventario]
      summary: Conciliación movimientos vs cache (incluye pares con cache faltante, ADMIN)
      parameters:
        - in: query
          name: productoId
          schema: { type: number }
        - in: query
          name: ubicacionId
          schema: { type: number }
      responses:
        "200":
          description: Resultados de conciliación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConciliacionRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inventario/fecha-servidor:
    get:
      operationId: getFechaServidor
      tags: [inventario]
      summary: Devuelve la fecha/hora actual del servidor (solo lectura, sin input de cliente)
      security: []
      responses:
        "200":
          description: Fecha y hora del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerTime"
  /inventario/conciliacion/recalcular:
    post:
      operationId: recalcularExistencias
      tags: [inventario]
      summary: Recalcula cache de existencias para un par (producto, ubicacion) (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecalcularInput"
      responses:
        "200":
          description: Recálculo completado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciliacionRow"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    LocationId:
      name: id
      in: path
      required: true
      schema:
        type: number
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ProductoId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ProveedorId:
      name: id
      in: path
      required: true
      schema:
        type: number
    RolloId:
      name: id
      in: path
      required: true
      schema:
        type: number
    MovimientoId:
      name: id
      in: path
      required: true
      schema:
        type: number
    EntradaId:
      name: id
      in: path
      required: true
      schema:
        type: number
  responses:
    Unauthorized:
      description: Sesión no válida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sin permisos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Demasiados intentos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ServerTime:
      type: object
      required: [fecha, zonaHoraria]
      properties:
        fecha:
          type: string
          format: date-time
          description: Fecha y hora ISO 8601 del servidor en UTC
        zonaHoraria:
          type: string
          enum: [America/Mexico_City]
          description: Zona horaria operativa del negocio
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Role:
      type: string
      enum: [ADMIN, CAJA, INVENTARIOS, BODEGA]
    LocationType:
      type: string
      enum: [TIENDA, BODEGA, TRANSITO, EXTERNO]
    Location:
      type: object
      required: [id, nombre, tipo, activa, esSistema]
      properties:
        id: { type: number }
        nombre: { type: string }
        tipo:
          $ref: "#/components/schemas/LocationType"
        activa: { type: boolean }
        esSistema: { type: boolean }
    LocationUpdate:
      type: object
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        activa: { type: boolean }
    CurrentUser:
      type: object
      required: [id, nombre, usuario, rol, ubicacion]
      properties:
        id: { type: number }
        nombre: { type: string }
        usuario: { type: string }
        rol:
          $ref: "#/components/schemas/Role"
        ubicacion:
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
    User:
      type: object
      required: [id, nombre, usuario, rol, ubicacion, activo, ultimoAcceso]
      properties:
        id: { type: number }
        nombre: { type: string }
        usuario: { type: string }
        rol:
          $ref: "#/components/schemas/Role"
        ubicacion:
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
        activo: { type: boolean }
        ultimoAcceso:
          type: ["string", "null"]
          format: date-time
    UserInput:
      type: object
      required: [nombre, usuario, password, rol]
      properties:
        nombre: { type: string, minLength: 2, maxLength: 120 }
        usuario: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 10, maxLength: 128 }
        rol:
          $ref: "#/components/schemas/Role"
        ubicacionId:
          type: ["number", "null"]
    UserUpdate:
      type: object
      properties:
        nombre: { type: string, minLength: 2, maxLength: 120 }
        usuario: { type: string, minLength: 3, maxLength: 64 }
        rol:
          $ref: "#/components/schemas/Role"
        ubicacionId:
          type: ["number", "null"]
        activo: { type: boolean }
        password: { type: string, minLength: 10, maxLength: 128 }
    LoginInput:
      type: object
      required: [usuario, password]
      properties:
        usuario: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 128 }
    Dashboard:
      type: object
      required: [tiendasActivas, bodegasActivas, usuariosActivos, inventarioPorUbicacion]
      properties:
        tiendasActivas: { type: number }
        bodegasActivas: { type: number }
        usuariosActivos: { type: number }
        inventarioPorUbicacion:
          type: array
          items:
            type: object
            required: [ubicacionId, nombre, metros, kilos, rollos]
            properties:
              ubicacionId: { type: number }
              nombre: { type: string }
              metros: { type: string, example: "0.000" }
              kilos: { type: string, example: "0.000" }
              rollos: { type: string, example: "0.000" }
    UnidadProducto:
      type: string
      enum: [METRO, KILO]
    TipoProveedor:
      type: string
      enum: [NACIONAL, IMPORTACION]
    Moneda:
      type: string
      enum: [MXN, USD]
    ProductoInventarioUbicacion:
      type: object
      required: [ubicacionId, nombre, rollos, cantidad]
      properties:
        ubicacionId: { type: number }
        nombre: { type: string }
        rollos: { type: number }
        cantidad: { type: string }
    Producto:
      type: object
      required: [id, sku, tela, color, unidad, precioSugerido, notas, activo, rollos, cantidad, createdAt, updatedAt]
      properties:
        id: { type: number }
        sku: { type: string }
        tela: { type: string }
        color: { type: string }
        unidad:
          $ref: "#/components/schemas/UnidadProducto"
        precioSugerido: { type: string }
        notas:
          type: ["string", "null"]
        activo: { type: boolean }
        rollos: { type: number }
        cantidad: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductoDetail:
      type: object
      required: [id, sku, tela, color, unidad, precioSugerido, notas, activo, rollos, cantidad, skuBloqueado, unidadBloqueada, inventarioPorUbicacion, createdAt, updatedAt]
      properties:
        id: { type: number }
        sku: { type: string }
        tela: { type: string }
        color: { type: string }
        unidad:
          $ref: "#/components/schemas/UnidadProducto"
        precioSugerido: { type: string }
        notas:
          type: ["string", "null"]
        activo: { type: boolean }
        rollos: { type: number }
        cantidad: { type: string }
        skuBloqueado: { type: boolean }
        unidadBloqueada: { type: boolean }
        inventarioPorUbicacion:
          type: array
          items:
            $ref: "#/components/schemas/ProductoInventarioUbicacion"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductoInput:
      type: object
      required: [tela, color, unidad, precioSugerido]
      properties:
        sku:
          type: string
          description: SKU personalizado; se genera automáticamente si se omite
        tela: { type: string, minLength: 1, maxLength: 200 }
        color: { type: string, minLength: 1, maxLength: 100 }
        unidad:
          $ref: "#/components/schemas/UnidadProducto"
        precioSugerido: { type: string }
        notas:
          type: ["string", "null"]
    ProductoUpdate:
      type: object
      properties:
        sku:
          type: string
          description: SKU personalizado; sólo permitido cuando skuBloqueado es false
        tela: { type: string, minLength: 1, maxLength: 200 }
        color: { type: string, minLength: 1, maxLength: 100 }
        unidad:
          $ref: "#/components/schemas/UnidadProducto"
        precioSugerido: { type: string }
        notas:
          type: ["string", "null"]
        activo: { type: boolean }
    ImportFileInput:
      type: object
      required: [fileName, content]
      properties:
        fileName: { type: string }
        content:
          type: string
          description: Contenido del archivo en base64
    ImportPreviewRow:
      type: object
      required: [rowIndex, tela, color, unidad, precioSugerido, notas, sku, estado]
      properties:
        rowIndex: { type: number }
        tela: { type: string }
        color: { type: string }
        unidad: { type: string }
        precioSugerido: { type: string }
        notas:
          type: ["string", "null"]
        sku: { type: string }
        estado:
          type: string
          enum: [NUEVO, DUPLICADO, ERROR]
        error:
          type: ["string", "null"]
    ImportConfirmInput:
      type: object
      required: [fileName, content]
      properties:
        fileName: { type: string }
        content:
          type: string
          description: Contenido del archivo en base64 (re-analizado en el servidor)
    ImportResult:
      type: object
      required: [insertados, duplicados, errores]
      properties:
        insertados: { type: number }
        duplicados: { type: number }
        errores: { type: number }
    Proveedor:
      type: object
      required: [id, nombre, tipo, monedaDefault, contactoNombre, telefono, correo, pais, notas, activo, createdAt]
      properties:
        id: { type: number }
        nombre: { type: string }
        tipo:
          $ref: "#/components/schemas/TipoProveedor"
        monedaDefault:
          $ref: "#/components/schemas/Moneda"
        contactoNombre:
          type: ["string", "null"]
        telefono:
          type: ["string", "null"]
        correo:
          type: ["string", "null"]
        pais:
          type: ["string", "null"]
        notas:
          type: ["string", "null"]
        activo: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProveedorInput:
      type: object
      required: [nombre, tipo]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 200 }
        tipo:
          $ref: "#/components/schemas/TipoProveedor"
        monedaDefault:
          $ref: "#/components/schemas/Moneda"
        contactoNombre:
          type: ["string", "null"]
        telefono:
          type: ["string", "null"]
        correo:
          type: ["string", "null"]
        pais:
          type: ["string", "null"]
        notas:
          type: ["string", "null"]
    ProveedorUpdate:
      type: object
      properties:
        nombre: { type: string, minLength: 1, maxLength: 200 }
        tipo:
          $ref: "#/components/schemas/TipoProveedor"
        monedaDefault:
          $ref: "#/components/schemas/Moneda"
        contactoNombre:
          type: ["string", "null"]
        telefono:
          type: ["string", "null"]
        correo:
          type: ["string", "null"]
        pais:
          type: ["string", "null"]
        notas:
          type: ["string", "null"]
        activo: { type: boolean }
    EstadoRollo:
      type: string
      enum: [PROGRAMADO, DISPONIBLE, EN_TRANSITO, ABIERTO, VENDIDO, BAJA]
    TipoMovimiento:
      type: string
      enum: [ALTA, RECEPCION, VENTA, DEVOLUCION, TRANSFERENCIA_SALIDA, TRANSFERENCIA_ENTRADA, SALIDA_MOSTRADOR, AJUSTE_POSITIVO, AJUSTE_NEGATIVO, CANCELACION]
    RolloSummary:
      type: object
      required: [id, serie, productoId, ubicacionId, estado, cantidadInicial, cantidadActual, costoUnitario, costoTotal, createdAt, updatedAt]
      properties:
        id: { type: number }
        serie: { type: string }
        productoId: { type: number }
        skuProducto: { type: string }
        telaProducto: { type: string }
        colorProducto: { type: string }
        ubicacionId: { type: number }
        nombreUbicacion: { type: string }
        proveedorId: { type: ["number", "null"] }
        estado:
          $ref: "#/components/schemas/EstadoRollo"
        cantidadInicial: { type: string }
        cantidadActual: { type: string }
        costoUnitario: { type: string }
        costoTotal: { type: string }
        notas: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MovimientoRow:
      type: object
      required: [id, rolloId, productoId, ubicacionId, tipo, cantidad, saldoPosterior, usuarioId, revisado, createdAt]
      properties:
        id: { type: number }
        rolloId: { type: number }
        serie: { type: string }
        productoId: { type: number }
        skuProducto: { type: string }
        ubicacionId: { type: number }
        nombreUbicacion: { type: string }
        tipo:
          $ref: "#/components/schemas/TipoMovimiento"
        cantidad: { type: string }
        saldoPosterior: { type: string }
        documentoTipo: { type: ["string", "null"] }
        documentoId: { type: ["string", "null"] }
        movimientoOrigenId: { type: ["number", "null"] }
        usuarioId: { type: number }
        justificacion: { type: ["string", "null"] }
        revisado: { type: boolean }
        revisadoPor: { type: ["number", "null"] }
        revisadoAt: { type: ["string", "null"], format: date-time }
        uuidCliente: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    RolloDetail:
      type: object
      required: [id, serie, productoId, ubicacionId, estado, cantidadInicial, cantidadActual, costoUnitario, costoTotal, historial, createdAt, updatedAt]
      properties:
        id: { type: number }
        serie: { type: string }
        productoId: { type: number }
        skuProducto: { type: string }
        telaProducto: { type: string }
        colorProducto: { type: string }
        unidadProducto: { type: string }
        ubicacionId: { type: number }
        nombreUbicacion: { type: string }
        proveedorId: { type: ["number", "null"] }
        estado:
          $ref: "#/components/schemas/EstadoRollo"
        cantidadInicial: { type: string }
        cantidadActual: { type: string }
        costoUnitario: { type: string }
        costoTotal: { type: string }
        notas: { type: ["string", "null"] }
        historial:
          type: array
          items:
            $ref: "#/components/schemas/MovimientoRow"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RolloListResult:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RolloSummary"
        total: { type: number }
        page: { type: number }
        pageSize: { type: number }
    ExistenciaRow:
      type: object
      required: [productoId, ubicacionId, rollosCount, cantidadTotal]
      properties:
        productoId: { type: number }
        skuProducto: { type: string }
        telaProducto: { type: string }
        colorProducto: { type: string }
        unidadProducto: { type: string }
        ubicacionId: { type: number }
        nombreUbicacion: { type: string }
        rollosCount: { type: number }
        cantidadTotal: { type: string }
    KardexResult:
      type: object
      required: [productoId, movimientos, total, page, pageSize]
      properties:
        productoId: { type: number }
        movimientos:
          type: array
          items:
            $ref: "#/components/schemas/MovimientoRow"
        total: { type: number }
        page: { type: number }
        pageSize: { type: number }
    ConciliacionRow:
      type: object
      required: [productoId, ubicacionId, cantidadMovimientos, cantidadCache, rollosMovimientos, rollosCache, discrepancia]
      properties:
