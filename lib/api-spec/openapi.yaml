        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Ventas de la tienda
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CajaTiendaVentasResult" }
