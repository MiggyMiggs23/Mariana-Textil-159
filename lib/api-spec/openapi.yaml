        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/cuadre-fiscal/diferencias/{id}/resolver:
    post:
      operationId: resolveAdminCuadreFiscalDiferencia
