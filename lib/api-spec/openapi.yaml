      type: object
      description: Documento interno facturado (tickets.facturado), no CFDI inventado. facturaId y ventaId identifican ticket; folioFactura es su folio interno; fechaFacturacion es fecha canónica del documento contabilizado, no fecha de timbrado. No afirma integración fiscal externa.
      additionalProperties: false
