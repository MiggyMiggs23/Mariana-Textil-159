            type: string,
            enum: [line, bar, stacked-bar, heatmap, treemap, scatter],
          }
        categoryKey: { type: string }
        series:
          {
            type: array,
            items:
              {
                type: object,
                required: [key, label],
                properties:
                  {
                    key: { type: string },
                    label: { type: string },
                    kind: { type: string },
                    economic: { type: boolean },
                    estimated: { type: boolean },
                  },
              },
          }
        rows:
          {
            type: array,
            items:
              {
                type: object,
                additionalProperties:
                  { $ref: "#/components/schemas/ReportePrimitive" },
              },
          }
