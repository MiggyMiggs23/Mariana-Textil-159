openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API para el sistema interno de Mariana Textil.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Sesión y acceso
  - name: dashboard
    description: Datos del tablero inicial
  - name: locations
    description: Administración de ubicaciones
  - name: users
    description: Administración de usuarios
  - name: productos
    description: Catálogo de productos/telas
  - name: precios
    description: Consulta y administración de precios según permisos efectivos
  - name: proveedores
    description: Administración de proveedores
  - name: clientes
    description: Catálogo operativo de clientes
  - name: permisos
    description: Administración de permisos por rol y por usuario
  - name: inventario
    description: Inventario de rollos, kardex, ajustes y conciliación
  - name: auditoria-inventario
    description: Conteos físicos de rollos por sitio
  - name: pos
    description: Punto de venta y búsqueda para terminal
  - name: caja
    description: Apertura, cobro y corte de caja
  - name: salidas
    description: Salidas entre ubicaciones y retiros completos a mostrador
  - name: admin-analytics
    description: Analítica financiera y operativa exclusiva para ADMIN
  - name: notificaciones
    description: Notificaciones dirigidas al usuario y alertas de crédito exclusivas para ADMIN
  - name: etiquetas
    description: Búsqueda y reimpresión controlada de etiquetas de rollos
  - name: contenedores
    description: Próximos contenedores y control anual de compras
  - name: auditoria
    description: Consulta por permiso de la bitácora inmutable
  - name: camionetas
    description: Catálogo histórico de camionetas para operaciones de transporte
  - name: choferes
    description: Catálogo histórico de choferes para operaciones de transporte
  - name: viajes
    description: Hojas históricas de despacho de documentos
  - name: equipos
    description: Registro de equipo del sistema y su configuración por sitio
paths:
  /pagos-dirigidos:
    get:
      operationId: listSolicitudesPagoDirigido
      tags: [clientes, proveedores]
      summary: Lista la cola de pagos dirigidos según el alcance del usuario
      parameters:
        - {
            in: query,
            name: tipo,
            schema: { type: string, enum: [CLIENTE, PROVEEDOR] },
          }
        - { in: query, name: entidadId, schema: { type: number, minimum: 1 } }
        - {
            in: query,
            name: estado,
            schema: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA] },
          }
      responses:
        "200":
          description: Solicitudes visibles
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/SolicitudesPagoDirigidoResult",
                    },
                },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createSolicitudPagoDirigido
      tags: [clientes, proveedores]
      summary: Solicita una excepción de aplicación FIFO; ADMIN la aplica inmediatamente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudPagoDirigidoInput" }
      responses:
        "201":
          description: Solicitud creada o aplicada
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/SolicitudPagoDirigido" },
                },
            }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /pagos-dirigidos/{id}/aprobar:
    post:
      operationId: aprobarSolicitudPagoDirigido
      tags: [clientes, proveedores]
      summary: Aprueba y aplica una solicitud de pago dirigido (ADMIN)
      parameters:
        [
          {
            in: path,
            name: id,
            required: true,
            schema: { type: number, minimum: 1 },
          },
        ]
      responses:
        "201":
          description: Aplicación creada
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/SolicitudPagoDirigidoAplicada",
                    },
                },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /pagos-dirigidos/{id}/rechazar:
    post:
      operationId: rechazarSolicitudPagoDirigido
      tags: [clientes, proveedores]
      summary: Rechaza una solicitud, conservando sus datos para captura FIFO posterior (ADMIN)
      parameters:
        [
          {
            in: path,
            name: id,
            required: true,
            schema: { type: number, minimum: 1 },
          },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/MotivoRechazoPagoDirigidoInput" }
      responses:
        "200":
          description: Solicitud rechazada
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/SolicitudPagoDirigido" },
                },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /camionetas:
    get:
      operationId: listCamionetas
      tags: [camionetas]
      summary: Lista el catálogo histórico de camionetas
      parameters:
        - in: query
          name: activa
          schema: { type: string, enum: ["true", "false", all], default: all }
          description: all incluye registros activos e inactivos.
      responses:
        "200":
          description: Camionetas visibles en configuración
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Camioneta" },
                    },
                },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createCamioneta
      tags: [camionetas]
      summary: Crea una camioneta histórica (ADMIN o SISTEMAS)
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/CamionetaInput" } },
          }
      responses:
        "201":
          {
            description: Camioneta creada,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Camioneta" } },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /camionetas/{id}:
    get:
      operationId: getCamioneta
      tags: [camionetas]
      summary: Obtiene una camioneta del catálogo histórico
      parameters: [{ $ref: "#/components/parameters/CamionetaId" }]
      responses:
        "200":
          {
            description: Camioneta,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Camioneta" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateCamioneta
      tags: [camionetas]
      summary: Edita o activa/desactiva una camioneta (ADMIN o SISTEMAS)
      parameters: [{ $ref: "#/components/parameters/CamionetaId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/CamionetaUpdate" } },
          }
      responses:
        "200":
          {
            description: Camioneta actualizada,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Camioneta" } },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /choferes:
    get:
      operationId: listChoferes
      tags: [choferes]
      summary: Lista el catálogo histórico de choferes
      parameters:
        - in: query
          name: activo
          schema: { type: string, enum: ["true", "false", all], default: all }
          description: all incluye registros activos e inactivos.
      responses:
        "200":
          {
            description: Choferes visibles en configuración,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Chofer" },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createChofer
      tags: [choferes]
      summary: Crea un chofer histórico (ADMIN o SISTEMAS)
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ChoferInput" } },
          }
      responses:
        "201":
          {
            description: Chofer creado,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Chofer" } },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /choferes/{id}:
    get:
      operationId: getChofer
      tags: [choferes]
      summary: Obtiene un chofer del catálogo histórico
      parameters: [{ $ref: "#/components/parameters/ChoferId" }]
      responses:
        "200":
          {
            description: Chofer,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Chofer" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateChofer
      tags: [choferes]
      summary: Edita o activa/desactiva un chofer (ADMIN o SISTEMAS)
      parameters: [{ $ref: "#/components/parameters/ChoferId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ChoferUpdate" } },
          }
      responses:
        "200":
          {
            description: Chofer actualizado,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Chofer" } },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /equipos:
    get:
      operationId: listEquipos
      tags: [equipos]
      summary: Lista equipos dentro del alcance de consulta
      parameters:
        - in: query
          name: ubicacionId
          schema: { type: number, minimum: 1 }
      responses:
        "200":
          description: Equipos visibles con su configuración canónica
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Equipo" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createEquipo
      tags: [equipos]
      summary: Registra equipo del sistema en un sitio permitido
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipoInput" }
      responses:
        "201":
          description: Equipo registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipo" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /equipos/ubicaciones:
    get:
      operationId: listEquiposLocations
      tags: [equipos]
      summary: Lista sitios operativos activos dentro del alcance de Equipos
      responses:
        "200":
          description: Sitios disponibles sin depender del permiso de Inventario
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UbicacionInventario" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /equipos/{id}:
    patch:
      operationId: updateEquipo
      tags: [equipos]
      summary: Edita equipo sin permitir cambiar manualmente su estado activo
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipoUpdate" }
      responses:
        "200":
          description: Equipo actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipo" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /equipos/{id}/checklist/{itemKey}:
    patch:
      operationId: toggleEquipoChecklist
      tags: [equipos]
      summary: Palomea o despalomea una casilla canónica
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, minimum: 1 }
        - in: path
          name: itemKey
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipoChecklistUpdate" }
      responses:
        "200":
          description: Equipo con el estado derivado actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipo" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Inicia sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Cierra la sesión actual
      responses:
        "204":
          description: Sesión cerrada
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Obtiene la sesión actual
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Obtiene conteos e inventario inicial por ubicación
      parameters:
        - in: query
          name: ubicacionId
          required: false
          schema:
            type: number
          description: Filtro opcional disponible únicamente para ADMIN
      responses:
        "200":
          description: Resumen del tablero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: Lista ubicaciones reales para administración
      responses:
        "200":
          description: Lista de ubicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Crea una tienda o bodega
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Ubicación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Edita el nombre, iniciales o estado de una ubicación
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Ubicación actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /locations/{id}/pisos:
    get:
      operationId: listPisosLocation
      tags: [locations]
      summary: Lista pisos; ADMIN puede incluir inactivos
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Pisos del sitio
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Piso" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPisoLocation
      tags: [locations]
      summary: Crea un piso (ADMIN)
      parameters: [{ $ref: "#/components/parameters/LocationId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PisoInput" } } }
      responses:
        "201": { description: Piso creado, content: { application/json: { schema: { $ref: "#/components/schemas/Piso" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /locations/{id}/pisos/{pisoId}:
    patch:
      operationId: updatePisoLocation
      tags: [locations]
      summary: Edita o activa/desactiva un piso (ADMIN)
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - { in: path, name: pisoId, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PisoUpdate" } } }
      responses:
        "200": { description: Piso actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Piso" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /inventario/rollos/{id}/piso:
    patch:
      operationId: updateRolloPiso
      tags: [inventario]
      summary: Cambia únicamente el piso físico actual de un rollo
      parameters: [{ $ref: "#/components/parameters/RolloId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RolloPisoUpdate" } } }
      responses:
        "200": { description: Rollo actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/RolloSummary" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Lista usuarios
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [users]
      summary: Crea un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Edita datos, estado, ubicación o contraseña de un usuario
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /productos:
    get:
      operationId: listProductos
      tags: [productos]
      summary: Lista productos del catálogo
      parameters:
        - in: query
          name: ubicacionId
          description: Limita existencias a una ubicación permitida por el alcance de consulta.
          schema: { type: number }
        - in: query
          name: existencia
          description: Filtra el catálogo según las existencias cacheadas en las ubicaciones permitidas.
          schema:
            type: string
            enum: [TODOS, CON_EXISTENCIA, AGOTADOS]
            default: TODOS
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"
        "401":
