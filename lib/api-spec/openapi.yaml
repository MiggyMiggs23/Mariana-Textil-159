          $ref: "#/components/responses/Conflict"
components:
  parameters:
    LocationId:
      name: id
      in: path
      required: true
      schema:
        type: number
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ProductoId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ProveedorId:
      name: id
      in: path
      required: true
      schema:
        type: number
    RolloId:
      name: id
      in: path
      required: true
      schema:
        type: number
    MovimientoId:
      name: id
      in: path
      required: true
      schema:
        type: number
    EntradaId:
      name: id
      in: path
      required: true
      schema:
        type: number
    SalidaId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ClienteId:
      name: id
      in: path
      required: true
      schema:
        type: number
    TicketId:
      name: id
      in: path
      required: true
      schema:
        type: number
    SesionCajaId:
      name: id
      in: path
      required: true
      schema:
        type: number
  responses:
    SalidaDetailResponse:
      description: Estado actualizado de la salida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SalidaDetail"
    Unauthorized:
      description: Sesión no válida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sin permisos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Demasiados intentos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ServerTime:
      type: object
      required: [fecha, zonaHoraria]
      properties:
        fecha:
          type: string
          format: date-time
          description: Fecha y hora ISO 8601 del servidor en UTC
        zonaHoraria:
          type: string
          enum: [America/Mexico_City]
          description: Zona horaria operativa del negocio
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
    Role:
      type: string
      enum: [ADMIN, TERMINAL, CAJA, INVENTARIOS, BODEGA]
    LocationType:
      type: string
      enum: [TIENDA, BODEGA, TRANSITO, EXTERNO]
    Location:
      type: object
      required: [id, nombre, tipo, activa, esSistema]
      properties:
        id: { type: number }
        nombre: { type: string }
        tipo:
          $ref: "#/components/schemas/LocationType"
        activa: { type: boolean }
        esSistema: { type: boolean }
    LocationUpdate:
      type: object
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        activa: { type: boolean }
    AlcanceConsulta:
      type: string
      enum: [PROPIA, TODAS]
    ModulePermission:
      type: object
      required: [modulo, puedeVer, puedeCrear, puedeEditar, puedeAutorizar]
      properties:
        modulo: { type: string }
        puedeVer: { type: boolean }
        puedeCrear: { type: boolean }
        puedeEditar: { type: boolean }
        puedeAutorizar: { type: boolean }
    PermissionFlags:
      type: object
      required: [puedeVer, puedeCrear, puedeEditar, puedeAutorizar]
      properties:
        puedeVer: { type: boolean }
        puedeCrear: { type: boolean }
        puedeEditar: { type: boolean }
        puedeAutorizar: { type: boolean }
    PermissionFlagsNullable:
      type: object
      properties:
        puedeVer: { type: ["boolean", "null"] }
        puedeCrear: { type: ["boolean", "null"] }
        puedeEditar: { type: ["boolean", "null"] }
        puedeAutorizar: { type: ["boolean", "null"] }
    PermisosRolRow:
      type: object
      required:
        [
          id,
          rol,
          modulo,
          puedeVer,
          puedeCrear,
          puedeEditar,
          puedeAutorizar,
          updatedAt,
        ]
      properties:
        id: { type: number }
        rol:
          $ref: "#/components/schemas/Role"
        modulo: { type: string }
        puedeVer: { type: boolean }
        puedeCrear: { type: boolean }
        puedeEditar: { type: boolean }
        puedeAutorizar: { type: boolean }
        updatedAt: { type: string, format: date-time }
        updatedPor: { type: ["number", "null"] }
    PermisosUsuarioRow:
      type: object
      required: [id, usuarioId, modulo, updatedAt]
      properties:
        id: { type: number }
