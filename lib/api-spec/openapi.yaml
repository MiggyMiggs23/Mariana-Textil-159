          nombreUsuario,
          abiertaAt,
          cerradaAt,
          fondoInicial,
          efectivoContado,
          estado,
        ]
      properties:
        id: { type: number }
        ubicacionId: { type: number }
        nombreUbicacion: { type: string }
        usuarioId: { type: number }
        nombreUsuario: { type: string }
        abiertaAt: { type: string, format: date-time }
        cerradaAt: { type: ["string", "null"], format: date-time }
        fondoInicial: { type: string }
        efectivoContado: { type: ["string", "null"] }
        estado:
          $ref: "#/components/schemas/EstadoSesionCaja"
    SesionCajaActual:
      type: object
      required: [sesion, resumen]
      properties:
        sesion:
          oneOf:
            - $ref: "#/components/schemas/SesionCaja"
            - type: "null"
        resumen:
          oneOf:
            - $ref: "#/components/schemas/SesionCajaResumen"
            - type: "null"
    CorteFormaPago:
      type: object
      required: [formaPago, importe, pagosCount, ticketsCount]
      properties:
        formaPago:
          $ref: "#/components/schemas/FormaPagoTicket"
        importe: { type: string }
        pagosCount: { type: number }
        ticketsCount: { type: number }
    CorteCuentaDestino:
      type: object
      required: [formaPago, cuentaDestino, importe]
      properties:
        formaPago:
          $ref: "#/components/schemas/FormaPagoTicket"
        cuentaDestino: { type: string }
        importe: { type: string }
    CorteFacturacion:
      type: object
      required: [facturado, ticketsCount, subtotal, iva, importe, efectivo, transferencia, credito]
      properties:
        facturado: { type: boolean }
        ticketsCount: { type: number }
        subtotal: { type: string }
        iva: { type: string }
        importe: { type: string }
        efectivo: { type: string }
        transferencia: { type: string }
        credito: { type: string }
    CorteMetreado:
      type: object
      required: [tipo, unidad, ticketsCount, cantidad, importe]
      properties:
        tipo:
          $ref: "#/components/schemas/TipoTicket"
        unidad:
          $ref: "#/components/schemas/UnidadProducto"
        ticketsCount: { type: number }
        cantidad: { type: string }
        importe: { type: string }
    CorteProducto:
      type: object
      required: [productoId, sku, tela, color, tipo, unidad, cantidad, importe]
      properties:
        productoId: { type: number }
        sku: { type: string }
        tela: { type: string }
        color: { type: string }
        tipo:
          $ref: "#/components/schemas/TipoTicket"
        unidad:
          $ref: "#/components/schemas/UnidadProducto"
        cantidad: { type: string }
        importe: { type: string }
    CortePendiente:
      type: object
      required: [ticketId, folio, total, nombreCliente, createdAt]
      properties:
        ticketId: { type: number }
        folio: { type: number }
        total: { type: string }
        nombreCliente: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    CorteTicketCobrado:
      type: object
      required: [ticketId, folio, importe, cobradoAt]
      properties:
        ticketId: { type: number }
        folio: { type: number }
        importe: { type: string }
        cobradoAt: { type: string, format: date-time }
    CorteCancelacion:
      type: object
      required: [ticketId, folio, importe, motivo, canceladoAt, autor]
      properties:
        ticketId: { type: number }
        folio: { type: number }
        importe: { type: string }
        motivo: { type: string }
        canceladoAt: { type: string, format: date-time }
        autor: { type: string }
    CorteCaja:
      type: object
      required:
        [
          sesion,
          formasPago,
          cuentasDestino,
          facturacion,
          metreado,
          productos,
          pendientes,
          ticketsCobrados,
          ticketsCobradosDetalle,
          cancelaciones,
          fondoInicial,
          totalCobrado,
          ivaCobrado,
          efectivoEsperado,
          efectivoContado,
          diferencia,
        ]
      properties:
        sesion:
          $ref: "#/components/schemas/SesionCaja"
        formasPago:
          type: array
          items:
            $ref: "#/components/schemas/CorteFormaPago"
        cuentasDestino:
          type: array
          items:
            $ref: "#/components/schemas/CorteCuentaDestino"
        facturacion:
          type: array
          description: Desglose facturado y no facturado
          items:
            $ref: "#/components/schemas/CorteFacturacion"
        metreado:
          type: array
          description: Desglose NORMAL y METREADO
          items:
            $ref: "#/components/schemas/CorteMetreado"
        productos:
          type: array
          items:
            $ref: "#/components/schemas/CorteProducto"
        pendientes:
          type: array
          items:
            $ref: "#/components/schemas/CortePendiente"
        ticketsCobradosDetalle:
          type: array
          items: { $ref: "#/components/schemas/CorteTicketCobrado" }
        ticketsCobrados:
          type: number
          description: Conteo de tickets cobrados en la sesión.
        cancelaciones:
          type: array
          items: { $ref: "#/components/schemas/CorteCancelacion" }
        fondoInicial: { type: string }
        totalCobrado: { type: string }
        ivaCobrado:
          {
            type: string,
            description: IVA incluido en los tickets cobrados de la sesión,
          }
        efectivoEsperado: { type: string }
        efectivoContado: { type: ["string", "null"] }
        diferencia: { type: ["string", "null"] }
        costo:
          type: ["string", "null"]
          description: Solo presente en respuestas exclusivas para ADMIN
        margen:
          type: ["string", "null"]
          description: Margen sobre subtotal; solo presente para ADMIN
        margenPorcentaje:
          type: ["string", "null"]
          description: Solo presente para ADMIN
        lineasExcluidasMargen:
          type: number
          description: Líneas metreadas sin rollo o sin costo, solo para ADMIN
