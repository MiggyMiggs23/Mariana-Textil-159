      tags: [etiquetas]
      summary: Obtiene un rollo y su contador de reimpresiones
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      responses:
        "200":
          description: Detalle para etiqueta
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/RolloEtiqueta" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /etiquetas/rollos/{id}/revisar:
    post:
      operationId: revisarEtiquetaRollo
      tags: [etiquetas]
      summary: Marca un rollo como revisado por ADMIN contra un watermark exacto
      parameters:
        - { in: path, name: id, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ultimaReimpresionId]
              properties:
                ultimaReimpresionId: { type: number, minimum: 1 }
      responses:
        "201":
          description: Revisión append-only creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionEtiqueta" }
        "200":
          description: El mismo watermark ya estaba revisado; respuesta idempotente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionEtiqueta" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: El rollo cambió o ya no está pendiente con ese watermark
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /etiquetas/rollos/{id}/revisiones:
    get:
