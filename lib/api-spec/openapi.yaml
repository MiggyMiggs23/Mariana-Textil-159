        [
          id,
          sku,
          tela,
          color,
          colorHex,
          anchoCm,
          composicion,
          gramajeGm2,
          unidad,
          seVendePorMetro,
          precioSugerido,
          notas,
          activo,
          rollos,
          cantidad,
          sitiosConExistencia,
          unidadBloqueada,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: number }
        sku: { type: string }
        tela: { type: string }
        color: { type: string }
