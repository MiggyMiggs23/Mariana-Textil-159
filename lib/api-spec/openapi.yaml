openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API para el sistema interno de Mariana Textil.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Sesión y acceso
  - name: dashboard
    description: Datos del tablero inicial
  - name: locations
    description: Administración de ubicaciones
  - name: users
    description: Administración de usuarios
  - name: productos
    description: Catálogo de productos/telas
  - name: proveedores
    description: Administración de proveedores
  - name: clientes
    description: Catálogo operativo de clientes
  - name: permisos
    description: Administración de permisos por rol y por usuario
  - name: inventario
    description: Inventario de rollos, kardex, ajustes y conciliación
  - name: pos
    description: Punto de venta y búsqueda para terminal
  - name: caja
    description: Apertura, cobro y corte de caja
  - name: salidas
    description: Solicitud, preparación y recepción de salidas entre ubicaciones
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Inicia sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Cierra la sesión actual
      responses:
        "204":
          description: Sesión cerrada
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Obtiene la sesión actual
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Obtiene conteos e inventario inicial por ubicación
      parameters:
        - in: query
          name: ubicacionId
          required: false
          schema:
            type: number
          description: Filtro opcional disponible únicamente para ADMIN
      responses:
        "200":
          description: Resumen del tablero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: Lista ubicaciones reales para administración
      responses:
        "200":
          description: Lista de ubicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Edita el nombre o estado de una ubicación
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Ubicación actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Lista usuarios
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [users]
      summary: Crea un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Edita datos, estado, ubicación o contraseña de un usuario
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /productos:
    get:
      operationId: listProductos
      tags: [productos]
      summary: Lista productos del catálogo
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProducto
      tags: [productos]
      summary: Crea un producto en el catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoInput"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /productos/{id}:
    get:
      operationId: getProducto
      tags: [productos]
      summary: Obtiene el detalle de un producto
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      responses:
        "200":
          description: Detalle del producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProducto
      tags: [productos]
      summary: Actualiza un producto del catálogo
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoUpdate"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /productos/import/preview:
    post:
      operationId: previewImportProductos
      tags: [productos]
      summary: Vista previa de importación de catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportFileInput"
      responses:
        "200":
          description: Filas con estado NUEVO, DUPLICADO o ERROR
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportPreviewRow"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /productos/import/confirm:
    post:
      operationId: confirmImportProductos
      tags: [productos]
      summary: Confirma importación de filas del catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportConfirmInput"
      responses:
        "200":
          description: Resultado de la importación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /proveedores/resumen:
    get:
      operationId: getProveedoresResumen
      tags: [proveedores]
      summary: Resumen agregado de todos los proveedores con saldos
      responses:
        "200":
          description: Resumen general de proveedores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedoresResumen"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /proveedores:
    get:
      operationId: listProveedores
      tags: [proveedores]
      summary: Lista proveedores con métricas de compras
      responses:
        "200":
          description: Objeto con resumen y lista de proveedores con métricas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedoresListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createProveedor
      tags: [proveedores]
      summary: Crea un proveedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProveedorInput"
      responses:
        "201":
          description: Proveedor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /proveedores/{id}:
    get:
      operationId: getProveedor
      tags: [proveedores]
      summary: Obtiene el detalle de un proveedor
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
      responses:
        "200":
          description: Detalle del proveedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProveedor
      tags: [proveedores]
      summary: Actualiza un proveedor
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProveedorUpdate"
      responses:
        "200":
          description: Proveedor actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/compras:
    get:
      operationId: listComprasProveedor
      tags: [proveedores]
      summary: Lista compras de un proveedor con estado Pagada/Parcial/Pendiente
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: query
          name: desde
          schema: { type: string, format: date }
          description: Fecha inicio (inclusive), formato YYYY-MM-DD
        - in: query
          name: hasta
          schema: { type: string, format: date }
          description: Fecha fin (inclusive), formato YYYY-MM-DD
        - in: query
          name: estado
          schema:
            type: string
            enum: [Pagada, Parcial, Pendiente]
          description: Filtrar por estado de pago
        - in: query
          name: page
          schema: { type: number, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: number, minimum: 1, maximum: 200, default: 20 }
      responses:
        "200":
          description: Lista paginada de compras del proveedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedorComprasResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/estado-cuenta:
    get:
      operationId: estadoCuentaProveedor
      tags: [proveedores]
      summary: Estado de cuenta cronológico con saldo corrido del proveedor
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: query
          name: desde
          schema: { type: string, format: date }
          description: Fecha inicio (inclusive), formato YYYY-MM-DD
        - in: query
          name: hasta
          schema: { type: string, format: date }
          description: Fecha fin (inclusive), formato YYYY-MM-DD
      responses:
        "200":
          description: Estado de cuenta con saldo corrido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedorEstadoCuenta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/pagos:
    get:
      operationId: listProveedorPagos
      tags: [proveedores]
      summary: Lista pagos de un proveedor (proveedores_finanzas requerido)
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
      responses:
        "200":
          description: Pagos del proveedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedorPagosResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: registrarPagoProveedor
      tags: [proveedores]
      summary: Registra un pago a proveedor (proveedores_finanzas + crear requerido)
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagoProveedorInput"
      responses:
        "201":
          description: Pago registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoProveedorRow"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/ajustes:
    post:
      operationId: registrarAjusteProveedor
      tags: [proveedores]
      summary: Registra un ajuste de saldo para un proveedor (ADMIN)
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AjusteProveedorInput"
      responses:
        "201":
          description: Ajuste registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoProveedorRow"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/estadisticas:
    get:
      operationId: estadisticasProveedor
      tags: [proveedores]
      summary: Estadísticas por periodo (desde y hasta requeridos)
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: query
          name: desde
          required: true
          schema: { type: string, format: date }
          description: Fecha inicio del periodo, formato YYYY-MM-DD
        - in: query
          name: hasta
          required: true
          schema: { type: string, format: date }
          description: Fecha fin del periodo, formato YYYY-MM-DD
      responses:
        "200":
          description: Estadísticas del periodo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedorEstadisticas"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /proveedores/{id}/exportar:
    get:
      operationId: exportarProveedorXlsx
      tags: [proveedores]
      summary: Exporta estado de cuenta del proveedor en XLSX
      parameters:
        - $ref: "#/components/parameters/ProveedorId"
        - in: query
          name: desde
          schema: { type: string, format: date }
          description: Fecha inicio, formato YYYY-MM-DD
        - in: query
          name: hasta
          schema: { type: string, format: date }
          description: Fecha fin, formato YYYY-MM-DD
      responses:
        "200":
          description: Archivo XLSX del estado de cuenta
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/entradas:
    post:
      operationId: crearEntrada
      tags: [inventario]
      summary: Crea una entrada completa (rollos DISPONIBLES) en una sola transacción
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntradaInput"
      responses:
        "201":
          description: Entrada creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntradaDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: listEntradas
      tags: [inventario]
      summary: Lista entradas con filtros para búsqueda y reimpresión
      parameters:
        - in: query
          name: folio
          schema: { type: number }
        - in: query
          name: proveedorId
          schema: { type: number }
        - in: query
          name: ubicacionId
          schema: { type: number }
        - in: query
          name: fechaDesde
          schema: { type: string, format: date }
        - in: query
          name: fechaHasta
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: pageSize
          schema: { type: number }
      responses:
        "200":
          description: Lista paginada de entradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntradaListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inventario/entradas/catalogos:
    get:
      operationId: getCatalogosEntrada
      tags: [inventario]
      summary: Catálogos operativos activos para capturar entradas
      description: Requiere entradas/ver. No devuelve costos, finanzas ni datos por ubicación.
      responses:
        "200":
          description: Productos y proveedores activos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogosEntrada"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inventario/entradas/{id}:
    get:
      operationId: getEntrada
      tags: [inventario]
      summary: Obtiene el detalle completo de una entrada
      parameters:
        - $ref: "#/components/parameters/EntradaId"
      responses:
        "200":
          description: Detalle de la entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntradaDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/entradas/{id}/costos:
    post:
      operationId: capturarCostosEntrada
      tags: [inventario]
      summary: Captura costos pendientes de una entrada (ADMIN)
      parameters:
        - $ref: "#/components/parameters/EntradaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapturarCostosEntradaInput"
      responses:
        "200":
          description: Entrada actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntradaDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventario/entradas/pendientes-costo/count:
    get:
      operationId: countEntradasPendientesCosto
      tags: [inventario]
      summary: Cuenta entradas con costos pendientes (ADMIN)
      responses:
        "200":
          description: Conteo
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: number }
        "403":
          $ref: "#/components/responses/Forbidden"
  /inventario/entradas/pendientes-costo:
    get:
      operationId: listEntradasPendientesCosto
      tags: [inventario]
      summary: Lista entradas con costos pendientes, más antiguas primero (ADMIN)
      parameters:
        - in: query
          name: page
          schema: { type: number, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: number, minimum: 1, maximum: 200, default: 20 }
      responses:
        "200":
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntradasPendientesCostoResult"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inventario/rollos/{id}/activar:
    post:
      operationId: activarRollo
      tags: [inventario]
      summary: Activa un rollo PROGRAMADO (PROGRAMADO → DISPONIBLE), registra RECEPCION
      parameters:
        - $ref: "#/components/parameters/RolloId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
