    E11EstadoCuenta:
      type: object
      additionalProperties: false
      required: [cliente, items, nextCursor, fuenteRevision]
      properties:
        cliente: { $ref: "#/components/schemas/E11FinanzasCliente" }
        items: { type: array, items: { $ref: "#/components/schemas/E11Movimiento" } }
        nextCursor: { type: [string, "null"] }
        fuenteRevision: { type: string }
    E11Periodo:
      type: object
      additionalProperties: false
      required: [tipo, inicio, finExclusivo, zona, obligatorio, estado, ultimaConciliacionId]
      properties:
        tipo: { type: string, enum: [DIA, SEMANA, MES] }
        inicio: { type: string, format: date }
        finExclusivo: { type: string, format: date }
        zona: { type: string, enum: [America/Mexico_City] }
        obligatorio: { type: boolean, description: SEMANA y MES true; DIA false }
        estado: { type: string, enum: [ABIERTO, PENDIENTE, CONGELADO, ACEPTADA, NO_CUADRA, REQUIERE_REVISION] }
        ultimaConciliacionId: { type: [string, "null"], format: uuid }
    E11Periodos:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/E11Periodo" } }
        nextCursor: { type: [string, "null"] }
    E11SnapshotInput:
      type: object
      additionalProperties: false
      required: [uuid, perfilVersion, tipo, inicio, fuenteRevision, revisionAnteriorId]
      properties:
        uuid: { type: string, format: uuid }
        perfilVersion: { type: integer, minimum: 0 }
        tipo: { type: string, enum: [DIA, SEMANA, MES] }
        inicio: { type: string, format: date }
        fuenteRevision: { type: string, minLength: 1 }
        revisionAnteriorId: { type: [string, "null"], format: uuid }
    E11DecisionInput:
      type: object
      additionalProperties: false
      required: [uuid, perfilVersion, revisionEsperada, fuenteRevision, resultado, totalExterno, referenciaExterna, observacion]
      properties:
        uuid: { type: string, format: uuid }
        perfilVersion: { type: integer, minimum: 0 }
        revisionEsperada: { type: integer, minimum: 1 }
        fuenteRevision: { type: string, minLength: 1 }
        resultado: { type: string, enum: [ACEPTADA, NO_CUADRA] }
        totalExterno: { $ref: "#/components/schemas/E5Money" }
        referenciaExterna: { type: string, minLength: 1, maxLength: 250 }
        observacion: { type: string, maxLength: 1000, description: Obligatoria no vacía para NO_CUADRA; no incluir datos sensibles }
    E11Decision:
      type: object
      additionalProperties: false
      required: [id, uuid, actorId, creadoEn, resultado, totalExterno, referenciaExterna, observacion, avisoAdminId]
      properties:
        id: { type: string, format: uuid }
        uuid: { type: string, format: uuid }
        actorId: { type: integer }
        creadoEn: { type: string, format: date-time }
        resultado: { type: string, enum: [ACEPTADA, NO_CUADRA] }
        totalExterno: { $ref: "#/components/schemas/E5Money" }
        referenciaExterna: { type: string }
        observacion: { type: string }
        avisoAdminId: { type: [string, "null"], format: uuid }
    E11Conciliacion:
      type: object
      additionalProperties: false
      required: [id, uuid, periodo, revision, anteriorId, fuenteRevision, vigente, congeladoEn, actorId, totalFacturado, cantidadVentas, evidenciaHash, decisiones]
      properties:
        id: { type: string, format: uuid }
        uuid: { type: string, format: uuid }
        periodo: { $ref: "#/components/schemas/E11Periodo" }
        revision: { type: integer }
        anteriorId: { type: [string, "null"], format: uuid }
        fuenteRevision: { type: string }
        vigente: { type: boolean }
        congeladoEn: { type: string, format: date-time }
        actorId: { type: integer }
        totalFacturado: { $ref: "#/components/schemas/E5Money" }
        cantidadVentas: { type: integer }
        evidenciaHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        decisiones: { type: array, items: { $ref: "#/components/schemas/E11Decision" } }
    E11PreparacionInput:
      type: object
      additionalProperties: false
      required: [uuid, perfilVersion, revisionEsperada, fuenteRevision, asignaciones]
      properties:
        uuid: { type: string, format: uuid }
        perfilVersion: { type: integer, minimum: 0 }
        revisionEsperada: { type: integer, minimum: 1 }
        fuenteRevision: { type: string, minLength: 1 }
        asignaciones: { type: array, minItems: 1, items: { $ref: "#/components/schemas/E5Asignacion" } }
    E11Preparaciones:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/E11Preparacion" } }
        nextCursor: { type: [string, "null"] }
    E11Preparacion:
      type: object
      additionalProperties: false
      required: [cobroId, clienteId, revision, fuenteRevision, retenido, notas, propuestaId]
      properties:
        cobroId: { type: string, format: uuid }
        clienteId: { type: integer }
        revision: { type: integer }
        fuenteRevision: { type: string }
        retenido: { $ref: "#/components/schemas/E5Money" }
        notas: { type: array, items: { $ref: "#/components/schemas/E11FinanzasNota" } }
        propuestaId: { type: [string, "null"], format: uuid }
