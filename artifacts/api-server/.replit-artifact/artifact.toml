kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd /home/runner/workspace && test \"$(sha256sum reports/e2-apertura-limitada/reconstruccion/runtime-preflight.mjs | cut -d' ' -f1)\" = 9a87b47b52d3776b10d760bdab6b9f5e71158f75ef71921ec8adbb3e0585de9f && test \"$(sha256sum artifacts/api-server/dist/index.mjs | cut -d' ' -f1)\" = 3415998ed6eb1b8d6977793ac53f43ce91477f691b12f5c8dc11d14a2b801a98 && export API_INSPECTION_BOOT=1 NODE_ENV=development && node reports/e2-apertura-limitada/reconstruccion/runtime-preflight.mjs && test \"$(sha256sum artifacts/api-server/dist/index.mjs | cut -d' ' -f1)\" = 3415998ed6eb1b8d6977793ac53f43ce91477f691b12f5c8dc11d14a2b801a98 && exec node --enable-source-maps artifacts/api-server/dist/index.mjs"

[services.development.env]
API_INSPECTION_BOOT = "1"
NODE_ENV = "development"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
